name: Podman Product Acceptance

# The full acceptance suites run real operator installs inside disposable
# systemd containers: minutes, not seconds, and a failure is worth reading.
# They get their own workflow so a red acceptance run cannot hide behind the
# fast lint contour, and so each product topology reports as its own check
# rather than one aggregate the others could mask.
# A push to a feature branch is a draft; nothing runs for it. What runs is the
# merge into develop and the review before it: this workflow alone keeps the
# push trigger because the ruleset publishes these five checks on `develop`
# itself, and the merge from a feature branch is the push that lands there.
# `tests/cases/gates.yaml` records that, and `gate --check` refuses a contract
# whose checks promise an event this block does not subscribe to.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  aio-podman-acceptance:
    name: All-in-One Podman Acceptance (${{ matrix.distribution }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distribution: [debian-12, debian-13, ubuntu-24.04, ubuntu-26.04]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Rootful Podman is what gives the suite a real systemd PID 1 plus the
      # network and mount namespaces it drives; netavark supplies the run
      # networks and nftables the rules the firewall cases read back.
      - name: Install rootful Podman and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman iproute2 nftables iputils-ping
          python3 -m pip install --disable-pip-version-check PyYAML

      # A cgroup v1 host silently changes what a systemd container can do, and
      # `network create --disable-dns` is a netavark option: with CNI the run
      # network would answer from its own resolver and the fixture zone would
      # stop being authoritative. Both are read from `podman info` as JSON
      # because the Go-template field names differ between Podman majors.
      - name: Verify the runtime the suite depends on
        run: |
          sudo podman version
          sudo podman info --format json | tee "${RUNNER_TEMP}/podman-info.json" >/dev/null
          python3 - "${RUNNER_TEMP}/podman-info.json" <<'PY'
          import json
          import sys

          host = json.load(open(sys.argv[1]))["host"]
          print(f"podman host: cgroup={host['cgroupVersion']} network={host['networkBackend']}")
          assert host["cgroupVersion"] == "v2", "the suite needs a cgroup v2 host"
          assert host["networkBackend"] == "netavark", "the suite needs the netavark network backend"
          PY

      - name: Execute the full All-in-One acceptance suite
        run: sudo python3 -m tools.run_podman_e2e --distribution '${{ matrix.distribution }}' --topology aio

      # `overall: PASS` is an aggregate: it would stay PASS if a data-plane case
      # stopped being declared, because the shorter suite is still all-green.
      # This reads the run's own case list back against the count the matrix owes
      # for the Vision configuration the run recorded.
      - name: Verify the positive-case counts the matrix owes
        if: success()
        run: sudo python3 -m tools.podman_e2e.trace --verify-run artifacts/podman-e2e

      # result.json, junit.xml and the evidence files are the debugging surface
      # of a failed case, so they are kept even when the step above exited 1.
      - name: Upload the run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podman-aio-${{ matrix.distribution }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/podman-e2e/
          if-no-files-found: warn
          retention-days: 14

  multi-node-podman-acceptance:
    name: Multi-Node Podman Acceptance (${{ matrix.distribution }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distribution: [debian-12, debian-13, ubuntu-24.04, ubuntu-26.04]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install rootful Podman and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman iproute2 nftables iputils-ping
          python3 -m pip install --disable-pip-version-check PyYAML

      - name: Verify the runtime the suite depends on
        run: |
          sudo podman version
          sudo podman info --format json | tee "${RUNNER_TEMP}/podman-info.json" >/dev/null
          python3 - "${RUNNER_TEMP}/podman-info.json" <<'PY'
          import json
          import sys

          host = json.load(open(sys.argv[1]))["host"]
          print(f"podman host: cgroup={host['cgroupVersion']} network={host['networkBackend']}")
          assert host["cgroupVersion"] == "v2", "the suite needs a cgroup v2 host"
          assert host["networkBackend"] == "netavark", "the suite needs the netavark network backend"
          PY

      - name: Execute the full Multi-Node acceptance suite
        run: sudo python3 -m tools.run_podman_e2e --distribution '${{ matrix.distribution }}' --topology multi-node

      # Same read-back as the All-in-One job, with four Vision combinations to
      # tell apart: 16, 18 or 20 positive cases depending on what ran.
      - name: Verify the positive-case counts the matrix owes
        if: success()
        run: sudo python3 -m tools.podman_e2e.trace --verify-run artifacts/podman-e2e

      - name: Upload the run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podman-multi-node-${{ matrix.distribution }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/podman-e2e/
          if-no-files-found: warn
          retention-days: 14

  # The Panel and the static decoy on one host, with no traffic plane at all.
  # It is a third product job rather than a flag on the All-in-One one: the
  # suite installs a different mode of the installer, owes a different case
  # list, and a failure here would otherwise hide behind a green All-in-One
  # install that provisioned a Node this mode must not provision.
  panel-only-podman-acceptance:
    name: Panel-only Podman Acceptance (${{ matrix.distribution }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distribution: [debian-12, debian-13, ubuntu-24.04, ubuntu-26.04]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install rootful Podman and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman iproute2 nftables iputils-ping
          python3 -m pip install --disable-pip-version-check PyYAML

      - name: Verify the runtime the suite depends on
        run: |
          sudo podman version
          sudo podman info --format json | tee "${RUNNER_TEMP}/podman-info.json" >/dev/null
          python3 - "${RUNNER_TEMP}/podman-info.json" <<'PY'
          import json
          import sys

          host = json.load(open(sys.argv[1]))["host"]
          print(f"podman host: cgroup={host['cgroupVersion']} network={host['networkBackend']}")
          assert host["cgroupVersion"] == "v2", "the suite needs a cgroup v2 host"
          assert host["networkBackend"] == "netavark", "the suite needs the netavark network backend"
          PY

      - name: Execute the Panel-only acceptance suite
        run: sudo python3 -m tools.run_podman_e2e --distribution '${{ matrix.distribution }}' --topology panel-only

      # The same read-back as the two full suites. Panel-only owes no
      # data-plane tuple, so the count rule is silent here and what it checks is
      # the five declared ids the run must have executed.
      - name: Verify the positive-case counts the matrix owes
        if: success()
        run: sudo python3 -m tools.podman_e2e.trace --verify-run artifacts/podman-e2e

      - name: Upload the run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podman-panel-only-${{ matrix.distribution }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/podman-e2e/
          if-no-files-found: warn
          retention-days: 14

  # The full jobs above fail when a case fails; none of them notices a recovery
  # case that was deleted from `cases()`, because the shorter suite still
  # reports PASS. These jobs run the same suites with `--require-group recovery`, which
  # makes the case ids a promise the run has to keep: an absent id and a
  # non-PASS one are both a red verdict, and the audit lands in result.json.
  # They run on the merge gate only — a push already spends the minutes on the
  # full suites, and the recovery contract is what a review must not merge past.
  aio-lifecycle-recovery:
    name: All-in-One Lifecycle and Recovery Acceptance (${{ matrix.distribution }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distribution: [debian-12, debian-13, ubuntu-24.04, ubuntu-26.04]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install rootful Podman and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman iproute2 nftables iputils-ping
          python3 -m pip install --disable-pip-version-check PyYAML

      - name: Verify the runtime the suite depends on
        run: |
          sudo podman version
          sudo podman info --format json | tee "${RUNNER_TEMP}/podman-info.json" >/dev/null
          python3 - "${RUNNER_TEMP}/podman-info.json" <<'PY'
          import json
          import sys

          host = json.load(open(sys.argv[1]))["host"]
          print(f"podman host: cgroup={host['cgroupVersion']} network={host['networkBackend']}")
          assert host["cgroupVersion"] == "v2", "the suite needs a cgroup v2 host"
          assert host["networkBackend"] == "netavark", "the suite needs the netavark network backend"
          PY

      - name: Execute the full All-in-One suite with the recovery contract
        run: sudo python3 -m tools.run_podman_e2e --distribution '${{ matrix.distribution }}' --topology aio --require-group recovery

      - name: Verify the positive-case counts the matrix owes
        if: success()
        run: sudo python3 -m tools.podman_e2e.trace --verify-run artifacts/podman-e2e

      - name: Upload the run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podman-aio-recovery-${{ matrix.distribution }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/podman-e2e/
          if-no-files-found: warn
          retention-days: 14

  multi-node-lifecycle-recovery:
    name: Multi-Node Lifecycle and Recovery Acceptance (${{ matrix.distribution }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distribution: [debian-12, debian-13, ubuntu-24.04, ubuntu-26.04]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install rootful Podman and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman iproute2 nftables iputils-ping
          python3 -m pip install --disable-pip-version-check PyYAML

      - name: Verify the runtime the suite depends on
        run: |
          sudo podman version
          sudo podman info --format json | tee "${RUNNER_TEMP}/podman-info.json" >/dev/null
          python3 - "${RUNNER_TEMP}/podman-info.json" <<'PY'
          import json
          import sys

          host = json.load(open(sys.argv[1]))["host"]
          print(f"podman host: cgroup={host['cgroupVersion']} network={host['networkBackend']}")
          assert host["cgroupVersion"] == "v2", "the suite needs a cgroup v2 host"
          assert host["networkBackend"] == "netavark", "the suite needs the netavark network backend"
          PY

      - name: Execute the full Multi-Node suite with the recovery contract
        run: sudo python3 -m tools.run_podman_e2e --distribution '${{ matrix.distribution }}' --topology multi-node --require-group recovery

      - name: Verify the positive-case counts the matrix owes
        if: success()
        run: sudo python3 -m tools.podman_e2e.trace --verify-run artifacts/podman-e2e

      - name: Upload the run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podman-multi-node-recovery-${{ matrix.distribution }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/podman-e2e/
          if-no-files-found: warn
          retention-days: 14

  aio-required:
    name: All-in-One Podman Acceptance
    needs: aio-podman-acceptance
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          MATRIX_RESULT: ${{ needs.aio-podman-acceptance.result }}
        run: test "$MATRIX_RESULT" = success

  multi-node-required:
    name: Multi-Node Podman Acceptance
    needs: multi-node-podman-acceptance
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          MATRIX_RESULT: ${{ needs.multi-node-podman-acceptance.result }}
        run: test "$MATRIX_RESULT" = success

  panel-only-required:
    name: Panel-only Podman Acceptance
    needs: panel-only-podman-acceptance
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          MATRIX_RESULT: ${{ needs.panel-only-podman-acceptance.result }}
        run: test "$MATRIX_RESULT" = success

  aio-recovery-required:
    name: All-in-One Lifecycle and Recovery Acceptance
    needs: aio-lifecycle-recovery
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          MATRIX_RESULT: ${{ needs.aio-lifecycle-recovery.result }}
        run: test "$MATRIX_RESULT" = success

  multi-node-recovery-required:
    name: Multi-Node Lifecycle and Recovery Acceptance
    needs: multi-node-lifecycle-recovery
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          MATRIX_RESULT: ${{ needs.multi-node-lifecycle-recovery.result }}
        run: test "$MATRIX_RESULT" = success
