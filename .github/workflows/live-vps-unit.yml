name: Live VPS runner unit tests

# A push to a feature branch is a draft; only a pull request into develop is gated.
on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  live-vps-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-live-vps.txt
      - name: Run Live VPS runner unit tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
