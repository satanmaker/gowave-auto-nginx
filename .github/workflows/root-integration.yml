name: Root and Integration Verification

# A push to a feature branch is a draft; only a pull request into develop is gated.
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  root-and-integration:
    name: Root Suite & Unprivileged Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx libnginx-mod-stream sqlite3 openssl curl ufw fail2ban certbot tar gzip openssh-server
          # The jail cases read a real daemon: they configure Fail2ban over the
          # host's own sshd, and `sshd -t` exits 255 on a host with no host keys
          # or no privilege-separation directory. The runner image ships
          # openssh-server with neither, so the precondition the suite documents
          # is established here rather than assumed — and the config test is run
          # once by the workflow, so a broken daemon-config names its own reason
          # instead of
          # surfacing as a product verdict inside the suite.
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A
          sudo sshd -t || { sudo sshd -T | head -20; exit 1; }
          sudo systemctl enable --now fail2ban

      # The suite imports every test module before it runs, and the protocol
      # matrix and the served-payload probes parse YAML, so the interpreter that
      # runs the unprivileged suite needs PyYAML.
      - name: Install Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML

      - name: Run Suite Root (EUID 0)
        run: |
          sudo python3 tests/run_ci.py --suite root

      - name: Run Suite Integration (Unprivileged EUID != 0)
        run: |
          python3 tests/run_ci.py --suite integration
