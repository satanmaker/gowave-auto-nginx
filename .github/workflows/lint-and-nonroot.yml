name: Lint and Nonroot Verification

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-nonroot:
    name: Lint, Completeness, and Suite Nonroot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck sqlite3 tar gzip openssl curl
          npm install -g @fission-ai/openspec

      # The completeness check imports every test module, and the protocol matrix
      # and the served-payload probes parse YAML, so the toolchain Python needs it.
      - name: Install Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML

      - name: ShellCheck validation
        run: |
          shellcheck --severity=error gowave-auto.sh gowave-node-auto.sh assets/backup/gowave-backup.sh modules/*.sh tests/*.sh

      # `--severity=error` structurally hides the warning class that covers
      # suppressed errexit (SC2310) and combined declare-and-assign (SC2155), and
      # those optional checks only exist in newer ShellCheck than the runner
      # ships. Report them without failing the build yet.
      - name: ShellCheck advisory checks
        continue-on-error: true
        run: |
          opts=()
          for opt in check-set-e-suppressed check-extra-masked-returns deprecate-which; do
            printf '#!/bin/sh\n' > /tmp/shellcheck-probe.sh
            if shellcheck -o "$opt" /tmp/shellcheck-probe.sh >/dev/null 2>&1; then
              opts+=(-o "$opt")
            fi
          done
          if ((${#opts[@]})); then
            shellcheck "${opts[@]}" gowave-auto.sh gowave-node-auto.sh \
              assets/backup/gowave-backup.sh modules/*.sh tests/*.sh
          fi

      - name: OpenSpec validation
        run: |
          command -v openspec
          openspec validate --all --strict

      - name: Test completeness check
        run: |
          python3 tests/run_ci.py --check-completeness

      - name: Run Suite Nonroot
        run: |
          python3 tests/run_ci.py --suite nonroot
