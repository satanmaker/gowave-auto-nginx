name: Live VPS E2E Verification

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target GitHub Environment"
        required: true
        default: "staging-vps"
        type: choice
        options:
          - staging-vps
          - production-vps
      acme_mode:
        description: "ACME mode (staging or production)"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      teardown_policy:
        description: "Teardown policy (PRESERVE or RESTORE_SNAPSHOT)"
        required: true
        default: "PRESERVE"
        type: choice
        options:
          - PRESERVE
          - RESTORE_SNAPSHOT

concurrency:
  group: live-vps-e2e-${{ inputs.environment || 'staging-vps' }}
  cancel-in-progress: false

jobs:
  live-vps-e2e:
    name: Run Live VPS E2E Test Suite
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'staging-vps' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Control Machine system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dnsutils openssh-client openssl curl libcap2-bin unzip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Download and install pinned Xray client binary
        env:
          LIVE_VPS_CONFIG: ${{ secrets.LIVE_VPS_CONFIG }}
        run: |
          XRAY_VERSION="$(printf '%s\n' "$LIVE_VPS_CONFIG" | awk -F= '$1 == "XRAY_CLIENT_VERSION" {print $2; exit}')"
          test -n "$XRAY_VERSION" || { echo "XRAY_CLIENT_VERSION missing from LIVE_VPS_CONFIG" >&2; exit 1; }
          mkdir -p /tmp/xray-bin
          curl -fsSL "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" -o /tmp/xray.zip
          unzip -q /tmp/xray.zip -d /tmp/xray-bin
          sudo mv /tmp/xray-bin/xray /usr/local/bin/xray
          sudo chmod 0755 /usr/local/bin/xray
          xray version

      - name: Download and install pinned Mihomo client binary
        env:
          LIVE_VPS_CONFIG: ${{ secrets.LIVE_VPS_CONFIG }}
        run: |
          MIHOMO_VERSION="$(printf '%s\n' "$LIVE_VPS_CONFIG" | awk -F= '$1 == "MIHOMO_CLIENT_VERSION" {print $2; exit}')"
          test -n "$MIHOMO_VERSION" || { echo "MIHOMO_CLIENT_VERSION missing from LIVE_VPS_CONFIG" >&2; exit 1; }
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-amd64-v${MIHOMO_VERSION}.gz" -o /tmp/mihomo.gz
          gunzip /tmp/mihomo.gz
          sudo mv /tmp/mihomo /usr/local/bin/mihomo
          sudo chmod 0755 /usr/local/bin/mihomo
          mihomo -v

      - name: Materialize live VPS configuration and SSH credentials
        env:
          LIVE_VPS_CONFIG: ${{ secrets.LIVE_VPS_CONFIG }}
          MASTER_SSH_KEY: ${{ secrets.MASTER_SSH_KEY }}
          WORKER_SSH_KEY: ${{ secrets.WORKER_SSH_KEY }}
          MASTER_KNOWN_HOSTS: ${{ secrets.MASTER_KNOWN_HOSTS }}
          WORKER_KNOWN_HOSTS: ${{ secrets.WORKER_KNOWN_HOSTS }}
          ACME_MODE: ${{ inputs.acme_mode }}
          TEARDOWN_POLICY: ${{ inputs.teardown_policy }}
        run: |
          mkdir -p ~/.ssh
          chmod 0700 ~/.ssh

          # Materialize SSH keys with mode 0600
          echo "$MASTER_SSH_KEY" > ~/.ssh/id_master
          chmod 0600 ~/.ssh/id_master

          echo "$WORKER_SSH_KEY" > ~/.ssh/id_worker
          chmod 0600 ~/.ssh/id_worker

          printf '%s\n' "$MASTER_KNOWN_HOSTS" > ~/.ssh/known_hosts_master
          chmod 0600 ~/.ssh/known_hosts_master

          printf '%s\n' "$WORKER_KNOWN_HOSTS" > ~/.ssh/known_hosts_worker
          chmod 0600 ~/.ssh/known_hosts_worker

          # Apply dispatch inputs and separate per-host SSH credentials.
          python3 - <<'PY'
          import os
          from pathlib import Path

          raw = os.environ.get("LIVE_VPS_CONFIG", "")
          if not raw.strip():
              raise SystemExit("LIVE_VPS_CONFIG secret is empty")
          replacements = {
              "SSH_KEY_PATH": str(Path.home() / ".ssh/id_master"),
              "SSH_KNOWN_HOSTS": str(Path.home() / ".ssh/known_hosts_master"),
              "MASTER_SSH_KEY_PATH": str(Path.home() / ".ssh/id_master"),
              "WORKER_SSH_KEY_PATH": str(Path.home() / ".ssh/id_worker"),
              "MASTER_KNOWN_HOSTS_PATH": str(Path.home() / ".ssh/known_hosts_master"),
              "WORKER_KNOWN_HOSTS_PATH": str(Path.home() / ".ssh/known_hosts_worker"),
              "ACME_MODE": os.environ["ACME_MODE"],
              "TEST_TEARDOWN_POLICY": os.environ["TEARDOWN_POLICY"],
          }
          lines = [line for line in raw.splitlines() if line.strip() and line.split("=", 1)[0].strip() not in replacements]
          lines.extend(f"{key}={value}" for key, value in replacements.items())
          target = Path("tools/live_vps_config.env")
          target.write_text("\n".join(lines) + "\n", encoding="utf-8")
          target.chmod(0o600)
          PY

      - name: Execute Live VPS E2E Test Suite
        run: |
          python3 tools/test_live_vps.py --config tools/live_vps_config.env --mode full

      - name: Upload JUnit XML test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-vps-junit-results
          path: artifacts/live-vps/**/junit.xml
          if-no-files-found: warn

      - name: Upload sanitized diagnostics and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-vps-diagnostics
          path: |
            artifacts/live-vps/**/result.json
            artifacts/live-vps/**/summary.txt
            artifacts/live-vps/**/diagnostics/
          if-no-files-found: warn
