name: Systemd Contract Checks and Services

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  services:
    name: Suite Services Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Suite Services (Unprivileged EUID != 0)
        run: |
          python3 tests/run_ci.py --suite services

  systemd-qemu-acceptance:
    name: Systemd Contract Suite (no VM boot)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run systemd contract tests (not a cold-boot acceptance test)
        run: |
          sudo python3 tests/run_ci.py --suite systemd
