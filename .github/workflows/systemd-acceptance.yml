name: Systemd Contract Checks, Services, and QEMU Matrix

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  services:
    name: Suite Services Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Suite Services (Unprivileged EUID != 0)
        run: |
          python3 tests/run_ci.py --suite services

  systemd-contracts:
    name: Systemd Static Unit Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run systemd static unit contract tests
        run: |
          sudo python3 tests/run_ci.py --suite systemd


  multi-node-podman:
    name: Multi-Node Podman Transport Acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install rootful Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman
      - name: Execute isolated Master/Worker transport acceptance
        run: sudo tests/podman_testbed.sh multi-node

  qemu-cold-boot:
    name: QEMU Cold Boot (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu 24.04"
            distro: "docker.io/library/ubuntu:24.04"
          - name: "Ubuntu 26.04"
            distro: "docker.io/library/ubuntu:26.04"
          - name: "Debian 12"
            distro: "docker.io/library/debian:12"
          - name: "Debian 13"
            distro: "docker.io/library/debian:13"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install QEMU and initramfs dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 cpio gzip

      - name: Execute genuine QEMU Cold Boot acceptance
        run: |
          sudo REPO_DIR="${{ github.workspace }}" tests/systemd/boot.sh "${{ matrix.distro }}"
