  - requirement: Live scenario parity
    cases: [TXN-01]
    reason: >-
      TXN-01 is the signal sentence of the transactional requirement, and it is
      driven as the shipped bytes rather than quoted: `tools/podman_e2e/signal_compensation.py`
      slices `handle_signal`, `handle_error`, `compensate_once`, the cleanup and
      the five traps out of the payload `gowave-node-auto.sh` streams to a
      Worker, renames the shipped `compensate_remote_worker` so a wrapper can
      count its callers, and runs the block over a scratch host root whose two
      roots — `WORKER_STATE_ROOT` and `WORKER_HOST_ROOT` — are the ones the
      compensation itself takes. The interrupted deployment is a real
      transaction: the before-image and the journal are written by the shipped
      functions, one inventoried binary is mutated and its mode changed, and the
      signal arrives while the run is between mutations. Four runs decide the
      sentence — TERM, HUP and INT against a restorable before-image, and TERM
      against one whose copy was altered after it was written, so the
      verification clause is decided in both directions. What the case reads
      back is the handlers' own report, the number of times the compensator ran,
      the sentinel of the mutation the interrupted run must never reach, the
      journal's state and mode, the bytes and the mode the restore left, the
      restore's own preserved-path sentence, the exit status and the payload's
      temp file. The service manager is stubbed because a rollback that stopped
      `gowave-node.service` would take down the host the suite installed; every
      other step of the compensation is the product's. Thirteen damages make the
      case refuse for the clause it protects: a TERM, HUP or INT handler that
      skips the compensator, a handler that compensates beside the guarded call,
      a run whose signal and error traps both stop nothing, a journal that is
      never written, a restore that skips pre-existing paths, one that writes a
      fixed mode, one that trusts a write it did not read back, one that trusts
      a copy changed after it was written, an interruption that exits zero, a
      cleanup that keeps the payload's temp file, and a compensation that
      removes the journal.
  - requirement: Live scenario parity
    cases: [TXN-02]
    reason: >-
      TXN-02 is the journal sentence of the transactional requirement, driven on
      both halves of the product. The journal half is `modules/recovery.py`: a
      mid-switch journal written by the product's own atomic writer is validated
      by its validator, is left at mode 0600 with no temporary sibling behind and
      still names the snapshot it took when read back, while a journal whose
      state does not belong to its operation is refused by the validator. The
      boot half is `recover_boot_files` from `modules/recovery.sh`, sourced in a
      temporary tree with the mutation lock and the file rollback stubbed: a
      recoverable journal is named by the state it reports, reaches the rollback
      of the snapshot the journal names and is left in `ROLLED_BACK`; a snapshot
      the journal names but the disk does not hold, a snapshot outside
      `RECOVERY_DIR`, and a journal that fails validation are each refused with
      the sentence that says what is refused, and each refusal leaves the journal
      exactly as it found it; a host with no journal reports nothing to recover.
      The ordering clause is read from the function's own body: the mutation lock
      is taken before the journal is read and before it is validated, which is
      what makes the next mutation wait for the recovery.
  - requirement: Live scenario parity
    cases: [TXN-03]
    reason: >-
      TXN-03 is the two-sided sentence of the transactional requirement: a failed
      `node add` whose Worker restore and Panel rollback disagree is reported
      INCOMPLETE and is not recorded as rolled back until both sides verify.
      `tools/podman_e2e/rollback_sides.py` slices the shipped
      `finalize_failed_node_add` out of `gowave-auto.sh` and runs it over a
      scratch tree. The Worker side is a stub `$SCRIPT_DIR/gowave-node-auto.sh`
      that records the transaction it was given and exits with the scenario's
      status — the seam the product already has, because the Worker rollback is
      a separate process on another host — and the API side is the product's own
      `rollback_provisioning` reading a journal this case wrote with the
      product's own atomic writer. Three runs decide the sentence: a
      `NODE_ADD_PREPARED` journal with no entities is a verified API side, and a
      `NODE_ADD_APPLYING` journal without a durable action ledger is the refusal
      that same function records. Each side failing while the other succeeds
      leaves the journal in `NODE_ADD_ROLLBACK_REQUIRED` with `rollback_sides`
      naming both verdicts, the aggregate refusal an operator reads, and the
      API's own refusal still in the record; both sides verified is the only run
      that reaches `NODE_ADD_ROLLED_BACK`. That the API writer cannot hide a
      later Worker failure is the clause the product failed before this case:
      the API rollback finalized a clean rollback itself, so the journal said
      ROLLED_BACK over a host that was never put back.
  - requirement: Live scenario parity
    cases: [NEG-03]
    reason: >-
      NEG-03 is the container half of the live scenario "Partial SSH deployment
      leaves no false COMMITTED journal state": what the Master records when the
      transport to a Worker it has already registered never answers. The
      operator's own `node add` runs on the installed Master, addressed to an
      address whose sshd is absent and whose host key the case pinned first, so
      the product registers the node with the Panel, writes the transaction
      journal, appends the node to `state.json` and only then dials. What the
      case reads is the Master's own recovery: the journal is left in
      `NODE_ADD_ROLLBACK_REQUIRED` with its action ledger intact and both
      compensation sides recorded -- the Worker side INCOMPLETE because nothing
      on the far end answered, the Panel API side ROLLED_BACK because the
      product's own `rollback_provisioning` deleted the entities the transaction
      created -- the product prints the INCOMPLETE sentence an operator acts on
      and no success line, `state.json` matches the pre-dispatch snapshot apart
      from its update timestamp, the Worker is gone from it, the Panel inventory
      is back to its pre-attempt counts, and the mutation lock is free. What the
      container does not prove is the far end: the remote payload never started,
      so the Worker's own restore is HOOK-03's and TXN-01's subject and a drop in
      the middle of the payload is the live run's. The case leaves the Master as
      it found it -- journal removed, `state.json` restored, pin withdrawn -- so
      the rest of the suite is not reading a half-finished transaction.
  - requirement: Live scenario parity
    cases: [OWN-01]
    reason: >-
      OWN-01 is the container half of the live requirement's scenario "Existing
      Worker system configuration is not overwritten": the Worker configuration
      MUST NOT truncate `/etc/sysctl.d/99-gowave-node.conf` when it did not write
      it, and later treat it as transaction-created. Two writers can truncate
