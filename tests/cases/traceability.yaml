  - requirement: Live scenario parity
    cases: [PRE-01, PRE-02, PRE-03, PRE-04, PRE-05, PRE-06, ADDR-01, ADDR-02, ADDR-03]
    reason: >-
      all nine serve the same parity sentence for the two sentences every run
      decides before it touches a host: what it trusts, and what it calls its
      targets. PRE-01 is the trust sentence — one host's key pinned and the
      other's absent, refused by name with the file that was read, the
