# Requirement -> scenario -> case/test -> CI job, for the delta spec.
#
# One row per scenario of
# `openspec/specs/podman-e2e/spec.md`. `cases` names ids
# the suites actually declare (`AIO-DP-*` and `MN-DP-*` expand against the
# matrix); `tests` names `tests.<module>.<Class>[.<method>]` ids that exist;
# `jobs` names jobs a workflow declares. A row with `gap` names the ledger task
# that still owns the missing work, and `tools/podman_e2e/trace.py --strict`
# refuses the table while any gap remains.
#
# The `behaviours` block below is a second view of the same cases: it names one
# promise at a time and quotes the `tests/cases/matrix.yaml` declaration that
# promise rests on, so a reader can ask what a single behaviour is proved by
# without walking the scenario rows. `behaviour_obligations` names the
# declarations the report has to cover; an obligation the behaviours stop
# naming is a failure, not a shorter report.
schema: gowave-podman-traceability/v1
version: 1
spec: openspec/specs/podman-e2e/spec.md
requirements:
  - requirement: Independent All-in-One acceptance topology
    scenarios:
      - scenario: All-in-One clean installation
        cases: [AIO-INSTALL, AIO-PACKAGES, AIO-04, AIO-01, AIO-03, AIO-05, AIO-02, TLS-01, NGX-04]
        topologies: [aio]
        tests:
          - tests.test_podman_aio.TestAioSuite
          - tests.test_podman_aio.TestAioVerificationCases
          - tests.test_podman_aio.TestTlsCaBundleCase
          - tests.test_podman_aio.TestVisionRouteCase
          - tests.test_podman_runner.TestPodmanRunnerContract
        jobs: [All-in-One Podman Acceptance]
      - scenario: All-in-One repeated provisioning
        cases: [AIO-IDEMPOTENT, AIO-RESTART]
        topologies: [aio]
        tests:
          - tests.test_podman_aio.TestIdempotentCase
          - tests.test_podman_aio.TestRestartCase
        jobs: [All-in-One Podman Acceptance]

  - requirement: Independent Multi-Node acceptance topology
    scenarios:
      - scenario: Multi-Node clean installation and registration
        cases: [MN-INSTALL, WRK-04, WRK-05, CLUS-01, CLUS-02, CLUS-03]
        topologies: [multi-node]
        tests:
          - tests.test_podman_multi_node.TestMultiNodeSuite
          - tests.test_podman_multi_node.TestWorkerRegistrationCase
          - tests.test_podman_cluster.TestClusterCases
        jobs: [Multi-Node Podman Acceptance]
      - scenario: Master and Worker optional domain configuration
        cases: [MN-VISION, NGX-04]
        topologies: [multi-node]
        tests:
          - tests.test_podman_cluster.TestVisionCase
          - tests.test_podman_multi_node.TestMultiNodeCounts
          - tests.test_podman_multi_node.TestVisionRouteCase
        jobs: [Multi-Node Podman Acceptance]
      - scenario: Worker dispatch is observed without the secret
        cases: [MN-ARGV-OBSERVER]
        topologies: [multi-node]
        tests:
          - tests.test_podman_argv_observer.TestStraceParsing
          - tests.test_podman_argv_observer.TestAcceptanceFixtures
          - tests.test_podman_argv_observer.TestObserverWiring
          - tests.test_podman_argv_observer.TestNodeAddIsTraced
          - tests.test_podman_argv_observer.TestArgvObserverCase
          - tests.test_podman_argv_observer.TestObserverDocumentation
        jobs: [Multi-Node Podman Acceptance]
      - scenario: Multi-Node deployment with one failed node and partial success
        cases: [MN-PARTIAL-SUCCESS]
        topologies: [multi-node]
        tests:
          - tests.test_podman_multi_node.TestPartialSuccessCase
        jobs: [Multi-Node Podman Acceptance]
      - scenario: Add-node refused by Panel API verification failure
        cases: [MN-ADD-NODE-REFUSED]
        topologies: [multi-node]
        tests:
          - tests.test_podman_multi_node.TestAddNodeRefusedCase
        jobs: [Multi-Node Podman Acceptance]

  - requirement: Independent Panel-only acceptance topology
    scenarios:
      - scenario: Panel-only clean installation
        cases: [PO-INSTALL, PO-HOST, PO-API]
        topologies: [panel-only]
        tests:
          - tests.test_podman_panel_only.TestPanelOnlySuite
          - tests.test_podman_panel_only.TestPanelOnlyInstallCase
          - tests.test_podman_panel_only.TestPanelOnlyHostCase
          - tests.test_podman_panel_only.TestPanelOnlyApiCase
        jobs: [Panel-only Podman Acceptance]
      - scenario: Panel-only Worker registration
        cases: [PO-SQUAD, PO-SQUAD-REFUSED]
        topologies: [panel-only]
        tests:
          - tests.test_podman_panel_only.TestPanelOnlySquadCase
          - tests.test_podman_panel_only.TestPanelOnlyRefusalProbe
        jobs: [Panel-only Podman Acceptance]
      - scenario: Add-node refused by Panel API verification failure
        cases: [MN-ADD-NODE-REFUSED]
        topologies: [panel-only]
        tests:
          - tests.test_podman_panel_only.TestPanelOnlyAddNodeRefusedCase
        jobs: [Panel-only Podman Acceptance]

  - requirement: Real Panel subscription lifecycle
    scenarios:
      - scenario: Subscription User-Agent policy is enforced
        cases: [SUB-SERVED, SUB-UA-ABSENT, SUB-UA-BLANK]
        topologies: [aio, multi-node]
        tests:
          - tests.test_podman_subscriptions.TestSubscriptionCases
        jobs: [All-in-One Podman Acceptance, Multi-Node Podman Acceptance]
      - scenario: Subscription is issued, updated where supported, and revoked
        cases: [AIO-CLIENT, AIO-REVOKE, MN-REVOKE]
        topologies: [aio, multi-node]
        tests:
          - tests.test_podman_traffic.TestRevocationCase
          - tests.test_podman_aio.TestPanelApiCases
        jobs: [All-in-One Podman Acceptance, Multi-Node Podman Acceptance]

  - requirement: Panel subscription representations
    scenarios:
      - scenario: Base64 share-link list matches the profile inventory
        cases: [SUB-B64]
        topologies: [aio, multi-node]
        tests:
          - tests.test_podman_subscriptions.TestSubscriptionCases
          - tests.test_podman_subscriptions.TestSubscriptionClientProbe
        jobs: [All-in-One Podman Acceptance, Multi-Node Podman Acceptance]
      - scenario: Xray JSON is validated in both served shapes
