      `_bootstrap_one` — the order being read from both modules' own source.
      What the delta spec states about all eight is the parity sentence itself,
      a Podman case for every container-reproducible live scenario
  - requirement: Live scenario parity
    cases: [MN-LOCK, MN-LOCK-LOSS, MN-LOCK-PATH, MN-LOCK-CLI, MN-LOCK-NESTED]
    reason: >-
      all five serve the same parity sentence for the two live requirements the
      delta spec writes no scenario about: the pair-wide lock a run holds over
      both hosts, and the one lock every management entry point has to take.
      MN-LOCK is the exclusivity sentence — a second runner is refused before
      either host is modified, by a sentence naming the held lock path, keeps no
      lease, and leaves the owner's published leases exactly as they were, run id
      and holder pid and token alike; the lock file outlives its holder, so once
      the owner releases a fresh runner takes both hosts with different tokens
      and the product's own `validate_mutation_lease` accepts the new holder's
      lease while refusing the released one. MN-LOCK-LOSS is the fail-closed
      sentence: one session's holder is terminated inside the host as a dropped
      connection ends it, the runner stops reporting both sessions alive, every
      mutating phase is then gated `INCOMPLETE` naming the lost lock while a
      read-only phase still reports, a contender that wins the freed host
      releases it when the other refuses so no run holds half the pair, and
      resuming means reacquiring both locks and revalidating the saved state
      rather than trying again. MN-LOCK-PATH is the refusal-before-mutation
      sentence of the entry-point requirement: a lock file that is a symlink, a
      directory, a FIFO, group-readable or owned by another user, and a lock
      directory that is itself a symlink, are each refused with the host address
      and the object named, the object is then found untouched and the pair-wide
      lock still free — each shape read on the host that was refused, and both
      hosts cleared first so the refusal cannot be the other host's leftover.
      MN-LOCK-CLI is the other half of that requirement, the commands rather than
      the path: the shipped `install`, `node add`, `node rollback`,
      `node reapply`, `domain-change`, `channel`, `uninstall` and
      `backup restore` are run against the holder and each has to print the
      lock's own sentence instead of the sentence it prints once it is past the
      lock, exit nonzero, leave every file it could rewrite at its digest, leave
      the protocol's two files alone and leave the holder's session alive, so a
      command with a private lock or none at all cannot pass; the Worker's own
      canonical file is read too, and its `remote_payload`/`remote_rollback`
      half is named as not driven because a valid Worker lease would reinstall
      it. MN-LOCK-NESTED is the re-entrancy sentence: the run's own lease is
      accepted in both transports the product supports — the environment and the
      `GOWAVE_LEASE:` stdin line — while a child with no lease is refused, and
      acceptance is proved with the parent's session alive, the lease
      byte-identical, the host's digests unchanged and the lock still held, so
      "the child ran" cannot be "the child took a lock the parent had dropped";
      a lease from a released holder and one replayed from a terminated holder
      are then refused as invalid or stale with a nonzero exit, and the
      terminated holder's token is refused by the product's own validator
  - requirement: Live scenario parity
    cases: [RUNID-01, RESUME-01]
    reason: >-
