      handed no IPv6 target is `INCOMPLETE` rather than `PASS`. ADDR-01, ADDR-02
      and ADDR-03 are the identity sentence: one address cannot be both hosts
      even when a second SSH port makes them look like two, the four mandatory
      names are pairwise unique under case folding, a non-root account is
      refused with no sudo path, and each refusal is shown to arrive before the
