# Cases that serve a requirement the delta spec states, where the spec writes no
# scenario for the behavior the case proves. Each entry names the requirement and
# why no scenario fits; `trace.py` still refuses an id no suite declares, and an
# id that is also mapped to a scenario above.
cases_by_requirement:
  - requirement: Real Panel subscription lifecycle
    cases: [AIO-AUTH]
    reason: >-
      the documented admin login, its bearer token and the authenticated read
      surface are what every subscription call consumes; the spec states the
      subscription scenarios and not the token underneath them
  - requirement: Panel subscription representations
    cases: [SUB-EDGE, SUB-EDGE-BAD]
    reason: >-
      the requirement states the bytes a consuming client is served and says
      nothing about the listener that stands between the Panel and that client:
      the public edge is where a pasted link is read first, and it has to answer
      a preview crawler with an empty 204, close a raw target no client would
      send, and keep the credential out of its access log. No scenario of the
      requirement states the edge contract
  - requirement: Independent All-in-One acceptance topology
    cases: [NGX-HYGIENE, NGX-SCANNER]
    reason: >-
      the requirement's scenarios state what the All-in-One install leaves
      running and what a client is served, and nothing about the listener that
      answers before the Panel: the edge has to keep its build out of every
      answer it writes, hand the Panel the peer address rather than a
      client-chosen one, and drop the scanner targets without a byte. No
      scenario of the requirement states the listener's own hygiene
  - requirement: Independent All-in-One acceptance topology
    cases: [PRE-INPUTS, PRE-INPUTS-BAD]
    reason: >-
      the requirement states what the All-in-One install leaves running and what
      a client is served, and no scenario states what happens to a request that
      cannot be honoured: the installer has to refuse a partial or malformed
      input before it stops NGINX or writes a managed path, and the refusal has
      to name the input. The host the first install left serving is the control,
      so one entry covers both the missing value and the value that is present
      but invalid
  - requirement: Independent All-in-One acceptance topology
    cases: [PRE-PROXY-CIDR, PRE-PROXY-CIDR-OVERRIDE]
    reason: >-
      the requirement states what the All-in-One install leaves running and what
      a client is served, and no scenario states the proxy CIDR preflight:
      a name answering from the Cloudflare proxy CIDR snapshot is refused
      before any certificate request, and GOWAVE_PREFLIGHT_ALLOW_PROXIED=1
      records the operator's decision to continue anyway. Both cases serve the
      same parity sentence for the preflight refusal that the live scenario
      states.
  - requirement: Camouflage decoy and certificate lineage
    cases: [NGX-05]
    reason: >-
      `nginx -t` on the generated tree and the deploy hook's refusal to reload a
      broken snippet are the contract that keeps the decoy and its lineage
      serving; the spec states the rendered decoy and not the tree reloaded
  - requirement: Explicit ACME Endpoint Selection and Certificate Lineage Isolation
    cases: [TLS-LINEAGE]
    reason: >-
      the requirement states the ACME directory selection and certificate lineage
      isolation; its scenarios cover ACME directory selection and lineage
      adoption, but no scenario states the repeated-install adoption of an
      existing suffixed lineage. This case serves that parity sentence by
      driving select_acme_lineage with a pre-existing suffixed lineage and
      verifying the adoption message, the returned directory, deterministic
      repetition, and that no exact-name lineage is created.
  - requirement: Explicit ACME Endpoint Selection and Certificate Lineage Isolation
    cases: [TLS-LINEAGE-BAD]
    reason: >-
      the requirement states the ACME directory selection and certificate lineage
      isolation; its scenarios cover ACME directory selection and lineage
      adoption, but no scenario states the refusal of expired or mismatched
