      the host. Each is run as the product runs it, on the host that carries it:
      the AIO contour sources the panel module in the container it installed, the
      multi-node contour runs the worker's writer on the worker container. Each
      writer is handed a path and asked about five states -- a file another tool
      wrote, an empty file, a symlink to the product's own lines, a file of
      nothing but those lines, and no file at all -- and the case reads back the
      exit status, the bytes, the mode and the `_SYSCTL_CREATED_BY_US` verdict
