# Cases that serve a requirement the delta spec states, where the spec writes no
# scenario for the behavior the case proves. Each entry names the requirement and
# why no scenario fits; `trace.py` still refuses an id no suite declares, and an
# id that is also mapped to a scenario above.
cases_by_requirement:
  - requirement: Real Panel subscription lifecycle
    cases: [AIO-AUTH]
    reason: >-
      the documented admin login, its bearer token and the authenticated read
      surface are what every subscription call consumes; the spec states the
      subscription scenarios and not the token underneath them
  - requirement: Camouflage decoy and certificate lineage
    cases: [NGX-05]
    reason: >-
      `nginx -t` on the generated tree and the deploy hook's refusal to reload a
      broken snippet are the contract that keeps the decoy and its lineage
      serving; the spec states the rendered decoy and not the tree reloaded
  - requirement: Security and network isolation verification
    cases: [AIO-NEG-DEP]
    reason: >-
      the public surface fails while the Panel's loopback API keeps answering,
      which is the isolation the requirement names, stated by no scenario
  - requirement: Failure injection and recovery
    cases: [AIO-FAULT-DISK, AIO-FAULT-PANEL, AIO-FAULT-XRAY, AIO-FAULT-LATENCY]
    reason: >-
      the requirement names dependency, network, service, filesystem and process
      failures; its two scenarios state a Worker outage and an interrupted
      operator, so the disk, Panel, core-process and latency faults serve the
      requirement directly
  - requirement: Live scenario parity
    cases: [AIO-PKT-02, MN-PKT-03, AIO-NEG-PIN, GATE-TEARDOWN]
    reason: >-
      all four witness a sentence of the live capability the delta spec states
      no scenario of its own for. The first two serve its per-case
      packet-evidence requirement — INCOMPLETE when the capture tool, the
      source-IP identity or a valid summary is missing, FAIL when a correct
      payload is attributed to the wrong VPS — and AIO-NEG-PIN serves its
      pinned-version requirement, where a floating installer branch or an
      installer whose bytes miss the configured digest has to be refused before
      anything runs. GATE-TEARDOWN serves its teardown-policy requirement: the
      policy a run ends in is a configuration file, a digest-pinned hook and a
      comparison, so the container reads what preflight refuses, what the hook
      is handed and the status a broken restore may not become. What the delta
      spec states about all four is the parity sentence itself, a Podman case
      for every container-reproducible live scenario
  - requirement: Live scenario parity
    cases: [VIS-CONFIG, VIS-GATE, VIS-05, VIS-06]
    reason: >-
      all four serve the same parity sentence for Vision sentences the delta
      spec writes no scenario about. VIS-CONFIG is the configuration's own
      reader: four accepted combinations, eight duplicate classes refused by
      name, and the live runner exiting on a duplicate before it creates a run
      directory — the uniqueness sentence of the live requirement. VIS-GATE is
      the port sentence: only the host whose own Vision domain is configured
      owes 8444 and 9444, and a host exempt from them is still held to the
      default port set. VIS-05 is the failure sentence: the installed host is
      asked once more for a Vision domain the fixture resolver answers with
      NXDOMAIN, which puts the failure in the Vision stage after the Panel and
      REALITY lineages already exist, so the rollback has something to preserve
      and the case compares digests of those lineages, the deploy hook, its
      ownership record and the NGINX tree instead of trusting the installer's
      account of itself. VIS-06 is the reporting sentence beside it: the same
      failing Vision stage with a compensation that cannot finish, because a
      detached watcher empties the journal's ledger once the transaction is
      VERIFYING, so the API rollback refuses to enumerate — and what the case
      reads is the aggregate CRITICAL line and the retained journal naming that
      refusal, never a clean compensation reported as PASS
  - requirement: Live scenario parity
    cases: [PRE-01, PRE-02, PRE-03, PRE-05, PRE-06, ADDR-01, ADDR-02, ADDR-03]
    reason: >-
      all eight serve the same parity sentence for the two sentences every run
      decides before it touches a host: what it trusts, and what it calls its
      targets. PRE-01 is the trust sentence — one host's key pinned and the
      other's absent, refused by name with the file that was read, the
      known_hosts byte count unchanged so the refusal is known to be a read and
      not a scan that appended the host it was asked to verify, an empty file
      refused with its own words, and the same check accepting the pinned key so
      the refusal is the pin and not a check that always fails; the ordering is
      read from the runner's own source, because a refusal that arrives after a
      remote baseline was collected has already used the key. PRE-02, PRE-03,
      PRE-05 and PRE-06 are the DNS sentence, answered by two real fixture
      resolvers on loopback because preflight refuses fewer than two independent
      resolvers: a name publishing another address fails with the domain, both
      addresses and both resolvers in the message and `PASS` when the same name
      is corrected, so the verdict is attributable; an unexpected AAAA fails
      while ENABLE_IPV6=false and the same names are accepted without it; with
      IPv6 on, every name's AAAA must be the configured address, a missing one
      is a missing record rather than a correct one, and a wrong one is named;
      and PRE-06 is the bypass clause — a configured Vision name's AAAA is held
      to the same rule, two resolvers disagreeing about it fail the run instead
      of being read as the union of their answers, and a firewall verification
      handed no IPv6 target is `INCOMPLETE` rather than `PASS`. ADDR-01, ADDR-02
      and ADDR-03 are the identity sentence: one address cannot be both hosts
      even when a second SSH port makes them look like two, the four mandatory
      names are pairwise unique under case folding, a non-root account is
      refused with no sudo path, and each refusal is shown to arrive before the
      local lock, before an SSH client, and before the operator's first
      `_bootstrap_one` — the order being read from both modules' own source.
      What the delta spec states about all eight is the parity sentence itself,
      a Podman case for every container-reproducible live scenario
  - requirement: Live scenario parity
    cases: [MN-LOCK, MN-LOCK-LOSS, MN-LOCK-PATH, MN-LOCK-CLI, MN-LOCK-NESTED]
    reason: >-
      all five serve the same parity sentence for the two live requirements the
      delta spec writes no scenario about: the pair-wide lock a run holds over
      both hosts, and the one lock every management entry point has to take.
      MN-LOCK is the exclusivity sentence — a second runner is refused before
      either host is modified, by a sentence naming the held lock path, keeps no
      lease, and leaves the owner's published leases exactly as they were, run id
      and holder pid and token alike; the lock file outlives its holder, so once
      the owner releases a fresh runner takes both hosts with different tokens
      and the product's own `validate_mutation_lease` accepts the new holder's
      lease while refusing the released one. MN-LOCK-LOSS is the fail-closed
      sentence: one session's holder is terminated inside the host as a dropped
      connection ends it, the runner stops reporting both sessions alive, every
      mutating phase is then gated `INCOMPLETE` naming the lost lock while a
      read-only phase still reports, a contender that wins the freed host
      releases it when the other refuses so no run holds half the pair, and
      resuming means reacquiring both locks and revalidating the saved state
      rather than trying again. MN-LOCK-PATH is the refusal-before-mutation
      sentence of the entry-point requirement: a lock file that is a symlink, a
      directory, a FIFO, group-readable or owned by another user, and a lock
      directory that is itself a symlink, are each refused with the host address
      and the object named, the object is then found untouched and the pair-wide
      lock still free — each shape read on the host that was refused, and both
      hosts cleared first so the refusal cannot be the other host's leftover.
      MN-LOCK-CLI is the other half of that requirement, the commands rather than
      the path: the shipped `install`, `node add`, `node rollback`,
      `node reapply`, `domain-change`, `channel`, `uninstall` and
      `backup restore` are run against the holder and each has to print the
      lock's own sentence instead of the sentence it prints once it is past the
      lock, exit nonzero, leave every file it could rewrite at its digest, leave
      the protocol's two files alone and leave the holder's session alive, so a
      command with a private lock or none at all cannot pass; the Worker's own
      canonical file is read too, and its `remote_payload`/`remote_rollback`
      half is named as not driven because a valid Worker lease would reinstall
      it. MN-LOCK-NESTED is the re-entrancy sentence: the run's own lease is
      accepted in both transports the product supports — the environment and the
      `GOWAVE_LEASE:` stdin line — while a child with no lease is refused, and
      acceptance is proved with the parent's session alive, the lease
      byte-identical, the host's digests unchanged and the lock still held, so
      "the child ran" cannot be "the child took a lock the parent had dropped";
      a lease from a released holder and one replayed from a terminated holder
      are then refused as invalid or stale with a nonzero exit, and the
      terminated holder's token is refused by the product's own validator
  - requirement: Live scenario parity
    cases: [RUNID-01, RESUME-01]
    reason: >-
      both serve the same parity sentence for the durable-run-state requirement
      the delta spec writes no scenario about. RUNID-01 is the artifact-root
      sentence: every hostile run id the requirement names — `..`, a separator,
      an encoded separator, NUL, dot only, empty, a leading dash, more than 64
      characters and a symlinked component — is refused by the product's own
      validator with the rule it broke and with the root unchanged, the accepted
      shapes resolve to a directory named strictly below that root that
      validation does not create, and the runner's own source order places the
      validation before the directory and before the SSH client. RESUME-01 is
      the partial-mode sentence: the record is written by the product's writer at
      mode 0600 and read by its own reader, the gate accepts a phase whose
      prerequisites passed and refuses another run id, commit or non-secret
      identity, a phase that already has a terminal result, and every phase whose
      prerequisite is not PASS with a sentence naming the reason, teardown is
      refused without both baselines, the baseline comparison reports drift on a
      host that grew a GoWave directory, started listening on a required port or
      lost a required tool while tolerating the fields no gate reads, and the
      runner re-collects that baseline before it copies the repository
  - requirement: Live scenario parity
    cases: [ENV-01, ENV-02, DP-12, DP-14, LOCAL-01]
    reason: >-
      all five serve the same parity sentence for four live sentences whose
      subjects are files and verdicts rather than a running pair. ENV-01 and
      ENV-02 are the disposable-environment gate: a container built from the
      run's own pinned image, given the two target-side tools the gate's own
      refusal asks for, passes `check_disposable_gate` with its ten-key manifest
      recorded and `evaluate_preflight_eligibility` reporting PASS while a
      sentinel file and the package count are byte-identical before and after,
      so the inspection is a read and not a repair; the same host then
      accumulates one contamination at a time — an existing `/opt/gowave`, a
      running unit, a listener on 443 made by the host's own sshd, a hidden
      `tcpdump` — and each step is refused by the gate's own sentence,
      cumulatively, with the verdict FAIL, the four reasons recorded verbatim in
      `master_gate_errors` and `worker_gate_errors`, the contaminated objects
      still in place, and the runner's own source order placing the halt before
      its first remote write. DP-12 is the production-trust sentence: the
      production bundle is the Control Machine's own public roots byte for byte,
      carries no Staging marker and no pinned Staging name, while the Staging
      bundle carries the four pinned roots and their marker; a pinned root
      verifies against the bundle that holds it and is refused by the production
      one with `openssl` as the only trust source, a public root verifies against
      production, the context built from it requires a certificate and a host
      name, and an unknown mode is refused rather than guessed. DP-14 is the
      skipped-traffic sentence: with `TEST_TRAFFIC_VERIFICATION` off, and with
      one case recorded SKIP, the suite's verdict is INCOMPLETE at both ends of
      the 8/10 range where those same cases pass with it on; the JUnit document
      a CI reader sees carries the skip and the traffic phase as an error,
      `result.json` records INCOMPLETE at mode 0600, the container aggregate
      turns a declared SKIP into FAIL, and the runner's own phase aggregation is
      quoted from its source because it is inline in `run_e2e` and has no
      callable seam. LOCAL-01 is the CI-credential sentence: the workflow that
      claims it declares read-only repository permission, interpolates no
      `secrets.` expression, runs in no Environment, installs the repository's
      own dependency file in one step and runs the discovery this case then runs
      with nothing a credential could arrive in — no `GOWAVE_*`, no agent
      socket, an empty home directory — which passes in seconds
  - requirement: Live scenario parity
    cases: [OP-01, OP-02, SSHID-01, SSHID-02, TSSH-01, TSSH-02]
    reason: >-
      all six serve the same parity sentence for the four live sentences about
      the operator's own controller rather than about a running pair. OP-01 is
      the input-gate sentence: the controller is driven with thirteen scripted
      answers and one field changed at a time, and each of the four invalid
      classes the sentence names — an unparsable address, a Vision domain that
      duplicates a panel domain, a malformed FQDN, a non-root SSH account — is
      refused by the strict parser with its own sentence while
      `socket.create_connection` is never called and no bootstrap is reached;
      the fully valid input then reaches exactly one bootstrap, and the source
      order places `load_config` before the first `_bootstrap_one` call, so the
      order is carried by a call site rather than by a comment. OP-02 is the
      password sentence: `_bootstrap_one` reads it through one `getpass` prompt
      whose text says hidden, hands it to exactly one `auth_password` call, and
      drops it before the first byte reaches the host, so it appears in no
      child's argv, in no environment variable, in no file under the runtime
      directory and in none of the controller's own output, while the ephemeral
      private key it does write is mode 0600. SSHID-01 and SSHID-02 are the
      host-key pair: a matching fingerprint lets password authentication
      proceed and pins the exact key the controller observed into a mode-0600
      `known_hosts` file, while a mismatched one aborts with the controller's
      own refusal, reads no password, writes no file, sends no command, arms no
      timer and leaves `authorized_keys` byte-identical. TSSH-01 and TSSH-02 are
      the temporary-access pair: the provider's existing `authorized_keys` entry
      survives beside exactly one `restrict ssh-ed25519` entry carrying the
      revocation marker, a persistent `OnActiveSec=2h` timer unit is written and
      armed before the entry is moved into place, and a bootstrap that fails
      after that point sends one cleanup attempt whose unverified outcome is
      reported with the timer named as the remaining bound — the timer still
      armed, the key never installed, the existing entry untouched
  - requirement: Live scenario parity
    cases: [HOOK-02]
    reason: >-
      HOOK-02 is the deploy-hook sentence of the ownership requirement, and it
      is driven rather than quoted: `modules/nginx.sh` is sourced in a temporary
      tree so `verify_deploy_hook_preflight`, `install_managed_deploy_hook` and
      `rollback_managed_deploy_hook` answer with the manifest, the ownership
      record and the digest they actually write. A hook the installation did not
      write is refused with the sentence that names the unmanaged resource, its
      bytes and the recovery root are unchanged and no manifest exists
      afterwards; the product's own hook is then installed with
      `created_by_tx` true, the recorded path and the digest the file has, and a
      repeated install recognises it instead of refusing; a hook edited after
      installation is preserved with the rollback refusing, and an untouched one
      is removed together with the ownership record that named it. The teardown
      half is `tools/live_vps/teardown.py`: `PRESERVE` answers with exactly its
      message, policy and status and claims no baseline it never compared, while
      the snapshot path — driven with a real executable restore hook and two
      matching captured baselines — reports `INCOMPLETE` with the pair-lock and
      ownership comparisons named as not implemented rather than claiming PASS.
  - requirement: Live scenario parity
    cases: [TXN-02]
    reason: >-
      TXN-02 is the journal sentence of the transactional requirement, driven on
      both halves of the product. The journal half is `modules/recovery.py`: a
      mid-switch journal written by the product's own atomic writer is validated
      by its validator, is left at mode 0600 with no temporary sibling behind and
      still names the snapshot it took when read back, while a journal whose
      state does not belong to its operation is refused by the validator. The
      boot half is `recover_boot_files` from `modules/recovery.sh`, sourced in a
      temporary tree with the mutation lock and the file rollback stubbed: a
      recoverable journal is named by the state it reports, reaches the rollback
      of the snapshot the journal names and is left in `ROLLED_BACK`; a snapshot
      the journal names but the disk does not hold, a snapshot outside
      `RECOVERY_DIR`, and a journal that fails validation are each refused with
      the sentence that says what is refused, and each refusal leaves the journal
      exactly as it found it; a host with no journal reports nothing to recover.
      The ordering clause is read from the function's own body: the mutation lock
      is taken before the journal is read and before it is validated, which is
      what makes the next mutation wait for the recovery.
  - requirement: Live scenario parity
    cases: [OWN-01]
    reason: >-
      OWN-01 is the container half of the live requirement's scenario "Existing
      Worker system configuration is not overwritten": the Worker configuration
      MUST NOT truncate `/etc/sysctl.d/99-gowave-node.conf` when it did not write
      it, and later treat it as transaction-created. Two writers can truncate
      that path -- the panel's `configure_bbr_and_mtu` in `modules/security.sh`,
      which owns `/etc/sysctl.d/99-gowave.conf`, and the worker's
      `configure_host_security` in the payload `gowave-node-auto.sh` streams to
      the host. Each is run as the product runs it, on the host that carries it:
      the AIO contour sources the panel module in the container it installed, the
      multi-node contour runs the worker's writer on the worker container. Each
      writer is handed a path and asked about five states -- a file another tool
      wrote, an empty file, a symlink to the product's own lines, a file of
      nothing but those lines, and no file at all -- and the case reads back the
      exit status, the bytes, the mode and the `_SYSCTL_CREATED_BY_US` verdict
      the function leaves behind. The unmanaged file keeps its bytes and its
      mode, the refusal names the path it refused, an empty file and a symlink
      are refused rather than adopted on the strength of what they contain, the
      product's own earlier file is rewritten in place without being recorded as
      created by this run, and only a path that did not exist is created, marked
      and removable by a rollback. What the container proves is the writer's own
      decision and the bytes it leaves on disk; the live run remains the source
      of truth for the baseline inspection that rejects or snapshots a real host
      before the first remote mutation. The kernel is not the subject: `sysctl`,
      `modprobe`, `systemctl` and `swapon` answer from shims, so no host is
      touched and no install runs.
  - requirement: Live scenario parity
    cases: [OWN-02]
    reason: >-
      OWN-02 is the container half of the live requirement's scenario "Existing
      Worker service or binary paths are not removed": a systemd unit, drop-in,
      binary or managed webroot that already exists is not a rollback target
      unless a complete ownership record proves it belongs to this run. The
      guard is `verify_worker_mutation_targets_preflight` in the payload
      `gowave-node-auto.sh` streams to the host, and its writer is
      `record_worker_mutation_targets`, which records every managed path this
      install left behind with the digest of each file and the target of each
      link it wrote, at mode 0600. The guard
      runs in `main` after the deploy-hook preflight and before the first
      managed path is touched -- before `setup_system_prereqs`,
      `configure_host_security`, `configure_firewall`, `unpack_cover_reality`,
      `configure_edge_nginx` and the upstream installer -- so a refusal leaves
      the host as it was. The case drives both shipped functions over a scratch
      root and reads back nineteen facts: a unit file another tool wrote is
      refused with the path named and keeps its bytes and its mode, a directory
      at a managed binary path is refused, a symlink is refused even when its
      target holds the very bytes the record names and stays a link, the guard
      writes no record on its way out, the record this install wrote adopts its
      own files and names them, a recorded file whose bytes changed is refused
      with its path named, a record that does not claim this product created
      anything is refused rather than trusted, a root with none of the
      managed paths is accepted, and the link the upstream installer writes into
      `/usr/local/bin` is adopted by the target the record names, stays that
      link, and is refused once it is re-pointed elsewhere. What the container
      proves is the guard's
      verdict and the bytes it leaves on disk; the live run remains the source
      of truth for the paths a real Worker carries before the first remote
      mutation. The record is the upgrade boundary this batch discloses: a host
      installed before the record existed has no record to adopt its unit,
      binaries, links and webroot, so the next install refuses and names the
      first path it cannot prove rather than overwriting it.
  - requirement: Live scenario parity
    cases: [HOOK-01]
    reason: >-
      HOOK-01 is the shape half of the same sentence: a manifest records that a
      transaction created a hook at the managed path, not that what now sits
      there is that hook. `verify_deploy_hook_preflight` from `modules/nginx.sh`
      is sourced in a temporary tree and asked about eight shapes at that path --
      a symlink whose target holds the recorded bytes, a symlink to a provider's
      own file, a directory, a FIFO, a file edited after its manifest, a file
      the manifest names under a different path, a manifest that cannot be
      parsed at all, and a hook directory that is itself a symlink -- and each
      one is refused, with the symlink still pointing where it did, the
      target's bytes unchanged, the directory still a directory and the FIFO
      still a FIFO afterwards. The unmanaged regular file is the clause read in
      full: it is refused with the sentence that names the unmanaged host
      resource, and its bytes, its 0640 mode and its owner are unchanged while
      the count of manifests under the recovery root is the same before and
      after. The positive control is the file the manifest names and whose
      digest it records, which is adopted, so the refusals are not a
      preflight that refuses everything. No host is touched and no install runs;
      the case reads the exit status and what the preflight left on disk.
  - requirement: Live scenario parity
    cases: [REV-01, REV-02]
    reason: >-
      the two are the revocation sentence of the credential requirement, decided
      by the controller the operator runs on this machine. `_cleanup_access`,
      `_revoke_all`, `_cleanup_summary_message`, `_write_operator_only_report`
      and `_refresh_report` are driven against a model of the SSH client that
      answers the four probes the cleanup makes and records every command it is
      sent, so REV-01 reads the whole pass rather than a claim: the client is
      built from the control-machine key and the pinned `known_hosts`, the
      remote revoke script is named and run, `authorized_keys` is searched for
      the run's marker and the expiry timer is probed, and the sentinel body of
      that key appears in no command and in no report, which is left at mode
      0600 inside a 0700 directory. REV-02 walks every way the cleanup can fail
      — the marker alone, the timer alone, both, a target whose revoke script is
      missing, and a verification whose connection dies — and each one is
      INCOMPLETE with the sentence that names what remains, the stuck host
      fails the run even though the clean one passes, and `_refresh_report` on
      an otherwise PASS run-state rewrites the overall result to INCOMPLETE and
      records the cleanup under `operator_access_cleanup` while a passing
      cleanup leaves the same state at PASS. The transport is a seam and the
      host is a model: no SSH server answers, and neither case claims one does.
  - requirement: Live scenario parity
    cases: [AIO-AUTH-NEG, MN-DUP-ADD, RED-01, RED-02, APIC-01]
    reason: >-
      all five serve the same parity sentence for rows of the live matrix the
      delta spec writes no scenario about. AIO-AUTH-NEG is the
      forged-credential row: four tokens copied from the one the documented
      login issued each fail exactly one clause of the Panel's own gate — an
      expired token signed with the Panel's real secret, a token signed with a
      foreign key, an unsigned `alg: none` token, and a correctly signed token
      naming an administrator record that does not exist — and every one is
      answered 401 with the middleware's `Unauthorized` body while the issued
      token still reads the same route before and after, so neither the refusal
      nor the control can be a route that simply stopped answering.
      MN-DUP-ADD is the duplicate-registration row: the operator's own
      `node add`, run a second time for the Worker it already registered, exits
      nonzero with the existing-name refusal before the Panel client is
      constructed, and the state file's bytes, the committed journal's bytes and
      the Panel inventory are what they were, which is what distinguishes a
      refusal from a second record that was created and then cleaned up. The
      third row of that group, a corrupted database inside an otherwise valid
      archive, is a variant of `MN-BACKUP-BAD` and is traced through the backup
      scenario rather than as a case of its own. RED-01 and RED-02 are the two
      rows of the live redaction requirement, which the delta spec also states
      without a scenario: RED-01 reads the operator's own credentials file,
      registers both secret values with the run's filter and writes the raw dump
      through the writer every artifact goes through, then reads the tree back —
      the field names survive, both values are `[REDACTED]`, and the run's own
      audit finds no file that changes when redacted, so a sibling artifact
      still holding a secret fails this case instead of being published. RED-02
      asks the real failure collector for its bundle on a healthy host and reads
      every area file back: the host's own kernel, distribution and installed
      package version, the unit state, journalctl's output, a listener, the
      vhost test, ufw's verdict and iptables' chain policy, and the served
      certificate's subject and validity — with no private key material and
      every file at 0600. The report-side half of that clause — API object
      summaries, traffic results and per-case timings — is carried by
      `result.json`, which the runner writes after the last case, so the case
      names it as not claimed here rather than reading a file that does not
      exist yet. APIC-01 is the bounded-client row: the controller's own
      `E2EPanelClient` logs in and lists nodes against the Panel's public name
      with the run's bundle, which is what makes the bundle the thing that
      carried the login, while a context with no anchor at all and the same
      bundle pointed at `127.0.0.1` are both refused — the second being
      hostname verification rather than a store the image happened to have.
      `API_TIMEOUT` is set to a value neither the client nor the parser defaults
      to and read back from both, and a caller that omits every optional
      argument still inherits that bound and the default context, so
      "production callers keep their behaviour" is measured rather than
      assumed. The two shipped sources are then read for a bypass token, so an
      `allowInsecure` or a disabled hostname check added to either makes the
      other clauses describe a client nobody ships

# What the published report has to cover, one declaration at a time. A plain
# path is met by any behaviour that quotes it; `every_value` makes every element
# of the manifest's list an obligation of its own, so a fifth Vision combination
# added to the matrix turns this audit red instead of quietly widening a report
# that still names four.
behaviour_obligations:
  - path: user_agent.accepted
  - path: user_agent.absent
  - path: user_agent.blank
  - path: representations.base64
  - path: representations.xray-json
  - path: topologies.multi-node.vision_combinations
    every_value: true

# Behaviours the change names one by one. `declares` quotes the manifest — the
# audit refuses a path it does not hold and a value it does not state — which is
# what keeps a behaviour from claiming a policy the matrix has moved away from.
behaviours:
  - behaviour: A subscription request carrying a User-Agent is served
    requirement: Real Panel subscription lifecycle
    declares:
      path: user_agent.accepted
      value: non-empty header
    cases: [SUB-SERVED]
    topologies: [aio, multi-node]
    tests:
      - tests.test_podman_subscriptions.TestPanelSubscriptionProbe.test_each_representation_is_fetched_with_its_client_user_agent
      - tests.test_podman_subscriptions.TestSubscriptionWiring.test_every_subscription_case_is_in_the_shared_catalog
    jobs: [All-in-One Podman Acceptance, Multi-Node Podman Acceptance]

  - behaviour: A subscription request without a User-Agent header is refused
    requirement: Real Panel subscription lifecycle
    declares:
      path: user_agent.absent
      value: 403
    cases: [SUB-UA-ABSENT]
    topologies: [aio]
    tests:
      - tests.test_podman_subscriptions.TestSubscriptionCases.test_absent_user_agent_case_is_refused_for_every_representation
      - tests.test_podman_subscriptions.TestPanelSubscriptionProbe.test_an_absent_user_agent_is_a_request_without_the_header
    jobs: [All-in-One Podman Acceptance]

  - behaviour: A subscription request with a blank User-Agent header is refused
    requirement: Real Panel subscription lifecycle
    declares:
      path: user_agent.blank
      value: 403
    cases: [SUB-UA-BLANK]
    topologies: [aio]
    tests:
      - tests.test_podman_subscriptions.TestSubscriptionCases.test_blank_user_agent_case_is_a_separate_result
      - tests.test_podman_subscriptions.TestPanelSubscriptionProbe.test_a_blank_user_agent_is_an_empty_header_not_a_missing_one
    jobs: [All-in-One Podman Acceptance]

  - behaviour: The base64 representation is the share-link list the inventory describes
    requirement: Panel subscription representations
    declares:
      path: representations.base64
      value: /api/sub/{shortUuid}
    cases: [SUB-B64]
    topologies: [aio, multi-node]
    tests:
      - tests.test_podman_subscriptions.TestSubscriptionCases.test_share_link_case_imports_the_decoded_list
      - tests.test_podman_subscriptions.TestSubscriptionClientProbe.test_the_base64_list_decodes_and_a_json_body_does_not
    jobs: [All-in-One Podman Acceptance, Multi-Node Podman Acceptance]

  - behaviour: The Xray JSON representation is served as a bare object and as a list
    requirement: Panel subscription representations
    declares:
      path: representations.xray-json
      value: /api/sub/{shortUuid}/v2ray-json
    cases: [SUB-JSON-SHAPES]
    topologies: [aio]
    tests:
      - tests.test_podman_subscriptions.TestSubscriptionCases.test_json_shape_case_loads_the_served_list_and_the_bare_object
      - tests.test_podman_subscriptions.TestSubscriptionClientProbe.test_json_shapes_accepts_the_served_list_and_the_bare_object
    jobs: [All-in-One Podman Acceptance]

  - behaviour: Worker provisioning dials the Master's private run address
    requirement: Podman-only Master address selection for Worker provisioning
    cases: [PODNET-MASTER-ADDR]
    topologies: [multi-node]
    tests:
      - tests.test_podman_multi_node.TestMasterAddressCase.test_the_run_address_is_accepted_when_the_worker_uses_it
      - tests.test_podman_address.TestPodmanAddressOverride.test_address_must_be_assigned_on_this_host
      - tests.test_podman_multi_node.TestWorkerProvisioningCommand.test_the_command_is_the_operator_entrypoint_with_positional_roles
    jobs: [Multi-Node Podman Acceptance]

  - behaviour: Vision runs on neither node
    requirement: Independent Multi-Node acceptance topology
    declares:
      path: topologies.multi-node.vision_combinations
      value: neither
    cases: [MN-VISION, MN-DP-*]
    topologies: [multi-node]
    tests:
      - tests.test_podman_cluster.TestVisionCase.test_a_node_without_vision_is_proven_to_have_no_endpoint_under_its_name
      - tests.test_podman_multi_node.TestMultiNodeCounts.test_the_four_vision_combinations_are_named_and_counted
    jobs: [Multi-Node Podman Acceptance]

  - behaviour: Vision runs on the Master only
    requirement: Independent Multi-Node acceptance topology
    declares:
      path: topologies.multi-node.vision_combinations
      value: master-only
    cases: [MN-VISION, MN-DP-*]
    topologies: [multi-node]
    tests:
      - tests.test_podman_cluster.TestVisionCase.test_the_inbound_is_matched_by_its_transport_not_by_its_tag
      - tests.test_podman_multi_node.TestMultiNodeCounts.test_the_four_vision_combinations_are_named_and_counted
    jobs: [Multi-Node Podman Acceptance]

  - behaviour: Vision runs on the Worker only
    requirement: Independent Multi-Node acceptance topology
    declares:
      path: topologies.multi-node.vision_combinations
      value: worker-only
    cases: [MN-VISION, MN-DP-*]
    topologies: [multi-node]
    tests:
      - tests.test_podman_cluster.TestVisionCase.test_a_worker_that_keeps_a_vision_vhost_without_it_is_refused
      - tests.test_podman_multi_node.TestMultiNodeCounts.test_the_four_vision_combinations_are_named_and_counted
    jobs: [Multi-Node Podman Acceptance]

  - behaviour: Vision runs on both nodes
    requirement: Independent Multi-Node acceptance topology
    declares:
      path: topologies.multi-node.vision_combinations
      value: both
    cases: [MN-VISION, MN-DP-*]
    topologies: [multi-node]
    tests:
      - tests.test_podman_cluster.TestVisionCase.test_each_combination_checks_both_nodes_against_their_own_names
      - tests.test_podman_multi_node.TestMultiNodeCounts.test_the_four_vision_combinations_are_named_and_counted
    jobs: [Multi-Node Podman Acceptance]

  - behaviour: A Worker whose pinned host key does not match is refused
    requirement: Security and network isolation verification
    cases: [MN-SSHKEY]
    topologies: [multi-node]
    tests:
      - tests.test_podman_multi_node.TestSshHostKeyCase.test_a_wrong_pin_that_still_connects_is_refused
      - tests.test_podman_multi_node.TestWorkerTrustPin.test_the_pin_is_reported_and_present_on_both_sides
    jobs: [Multi-Node Podman Acceptance]

  - behaviour: A rotated Worker host key is adopted and a stale pin is not
    requirement: Security and network isolation verification
    cases: [MN-SSHKEY]
    topologies: [multi-node]
    tests:
      - tests.test_podman_multi_node.TestSshHostKeyCase.test_the_pinned_key_gates_every_operation_and_a_rotation_is_adopted
      - tests.test_podman_multi_node.TestSshHostKeyCase.test_a_stale_pin_accepted_after_rotation_is_refused
    jobs: [Multi-Node Podman Acceptance]

  - behaviour: The decoy apex is derived from the cover names each role resolves
    requirement: Camouflage decoy and certificate lineage
    cases: [NGX-COVER-DERIVE]
    topologies: [multi-node]
    tests:
      - tests.test_podman_multi_node.TestCoverDeriveCase.test_both_roles_report_the_derived_apex_and_their_binding
