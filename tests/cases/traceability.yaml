      mode, the refusal names the path it refused, an empty file and a symlink
      are refused rather than adopted on the strength of what they contain, the
      product's own earlier file is rewritten in place without being recorded as
      created by this run, and only a path that did not exist is created, marked
      and removable by a rollback. What the container proves is the writer's own
      decision and the bytes it leaves on disk; the live run remains the source
      of truth for the baseline inspection that rejects or snapshots a real host
      before the first remote mutation. The kernel is not the subject: `sysctl`,
      `modprobe`, `systemctl` and `swapon` answer from shims, so no host is
      touched and no install runs.
  - requirement: Live scenario parity
    cases: [OWN-02]
    reason: >-
      OWN-02 is the container half of the live requirement's scenario "Existing
      Worker service or binary paths are not removed": a systemd unit, drop-in,
      binary or managed webroot that already exists is not a rollback target
      unless a complete ownership record proves it belongs to this run. The
      guard is `verify_worker_mutation_targets_preflight` in the payload
      `gowave-node-auto.sh` streams to the host, and its writer is
      `record_worker_mutation_targets`, which records every managed path this
      install left behind with the digest of each file and the target of each
      link it wrote, at mode 0600. The guard
      runs in `main` after the deploy-hook preflight and before the first
      managed path is touched -- before `setup_system_prereqs`,
      `configure_host_security`, `configure_firewall`, `unpack_cover_reality`,
      `configure_edge_nginx` and the upstream installer -- so a refusal leaves
      the host as it was. The case drives both shipped functions over a scratch
      root and reads back nineteen facts: a unit file another tool wrote is
      refused with the path named and keeps its bytes and its mode, a directory
      at a managed binary path is refused, a symlink is refused even when its
      target holds the very bytes the record names and stays a link, the guard
      writes no record on its way out, the record this install wrote adopts its
      own files and names them, a recorded file whose bytes changed is refused
      with its path named, a record that does not claim this product created
      anything is refused rather than trusted, a root with none of the
      managed paths is accepted, and the link the upstream installer writes into
      `/usr/local/bin` is adopted by the target the record names, stays that
      link, and is refused once it is re-pointed elsewhere. What the container
      proves is the guard's
      verdict and the bytes it leaves on disk; the live run remains the source
      of truth for the paths a real Worker carries before the first remote
      mutation. The record is the upgrade boundary this batch discloses: a host
      installed before the record existed has no record to adopt its unit,
      binaries, links and webroot, so the next install refuses and names the
      first path it cannot prove rather than overwriting it.
  - requirement: Live scenario parity
    cases: [OWN-03]
    reason: >-
      OWN-03 is the firewall half of the same sentence: a host whose UFW is
      active, or holds rules and default policies the operator set, must come
      back from an injected failure with every original rule, every default
      policy and the enabled state -- not with the four rules this install adds
      deleted from whatever is left. The before-image is `firewall_image
      capture` inside the payload's `configure_firewall`, taken before the first
      `ufw default`, `ufw allow` or `ufw --force enable` runs; the way back is
      `firewall_image restore`, which the compensating rollback and the
      standalone rollback both call. The image lives in the transaction's own
      recovery directory and holds the enabled state, the three default
      policies, the rule text, the IPv4 and IPv6 kernel dumps and the seven UFW
      configuration files it may rewrite, each copy at mode 0600 with its digest
      and its owner, and a baseline it cannot read back is refused before
      anything is mutated. The case drives the four shipped functions over a
      scratch root whose `ufw`, `iptables-save`, `ip6tables-save`,
      `iptables-restore` and `ip6tables-restore` are shims that keep the state
      in files, and reads back twenty facts: the image is per transaction,
      taking it changes nothing, it names the enabled state, the three policies,
      the rule text, both dumps and the configuration it rewrote, a second
      capture is refused rather than overwriting the first, a firewall that was
      off is captured as off rather than refused, a restore with no image is
      refused rather than guessing, the read-back compares the rules and not the
      counters and the timestamp a dump carries, and an install whose baseline
      cannot be read is refused and leaves no half image behind. The injected
      failure is the install's own sequence -- `user.rules` rewritten with its
      two rules, the operator's permissive incoming policy set to deny, UFW
      enabled -- and the restore returns the active state, the rule that lived
      only in the kernel dump and therefore in no file UFW reloads, the
      operator's own policy and the original `/etc/default/ufw`, and a second
      restore leaves the same firewall; the other direction starts from an
      inactive UFW, whose `ufw status verbose` prints no default policy line at
      all and whose rules live only in the kernel, and ends inactive with them
      back. The read-back is the product's own: `ufw status verbose` must
      match the image byte for byte, and `iptables-save` must return the same
      rules once the timestamp and the counters it prints are set aside -- they
      move by themselves, and a restore zeroes them -- so a partial restore is a
      refusal and not a report. The kernel is not the
      subject and no host is touched: no install runs, and the container proves
      the functions' verdict and the bytes they leave on disk.
  - requirement: Live scenario parity
    cases: [OWN-04]
    reason: >-
      OWN-04 is the aggregate of §Complete Mutation-Target Baseline and
      Resource Ownership: after a later deployment step fails, every path the
      transaction created is removed only while it is still what the install
      wrote, every path that was here before is put back with its recorded
      content and metadata, and anything changed afterwards -- or that no
      record can prove -- is preserved with the cleanup reported incomplete
      instead of a success reported for a rollback that left the host dirty.
      The before-image is `worker_targets_image capture`, taken after the ACME
      snapshot and before `setup_system_prereqs` mutates anything, and written
      into the transaction's own recovery directory; the way back is
      `worker_targets_image restore`, which the in-payload compensation and the
      standalone rollback both call in place of the blanket `rm -rf` list that
      used to name `/opt/gowave-node`, `/opt/remnanode`, the two binaries, the
      six NGINX files and both webroots whether or not this transaction wrote
      them. Each inventoried path is recorded as absent, as a file with its
      bytes copied into the image at mode 0600 plus its mode, its owner and its
      digest, as a symlink with its target, or as a directory, and the manifest
      is written at mode 0600 after the copies. The record a created path is
      compared against is the ownership record OWN-02 already ships, so a path
      with no record behind it is preserved rather than removed. The case
      drives the six shipped functions over a scratch root and reads back
      nineteen facts: the image is per transaction, taking it changes nothing,
      it names every inventoried path and calls none of them absent that is
      there, it holds the pre-existing file's bytes and its mode and owner, the
      link's target and the directory, a second capture is refused rather than
      overwriting the first, a restore removes the created paths, restores the
      pre-existing file's bytes, mode and link, preserves a created path that
      was touched after the record was written, preserves every created path
      when the record is gone, preserves everything and names the missing image
      when there is none, refuses to write a before-image copy that changed
      after it was taken, and reports the cleanup incomplete with a non-zero
      exit whenever it preserved anything. What the container proves is the
      functions' verdict and the bytes they leave on disk; the live run remains
      the source of truth for the paths a real Worker carries.
  - requirement: Live scenario parity
    cases: [HOOK-03]
    reason: >-
      HOOK-03 is the sentence that makes a Worker run recoverable after the
      process cannot clean up after itself: a deployment terminated by SIGKILL,
      a kernel panic or a power loss leaves its transaction journal behind, and
      the next authenticated entrypoint reconciles it before it writes anything
      of its own. The journal is `worker_transaction_journal` and
      `worker_journal_action` in `gowave-node-auto.sh`: one writer for the
      states this product knows, written at mode 0600 through a temporary
      sibling and a rename with the file and its directory synced, refusing a
      journal that cannot be read back, that names another transaction, or that
      would reopen a transaction already installed. The install writes
      `started` after its before-image exists and before `setup_system_prereqs`
      touches the first path, marks it `installed` once
      `record_worker_mutation_targets` has verified what it wrote, and the
      standalone rollback reconciles every other transaction under the mutation
      lock while skipping the one it was invoked for. The reader restores a
      `started` transaction from its own Worker and firewall before-images and
      releases its directory; a transaction that installed but was never
      finalized, one whose before-image cannot be restored, and one whose
      journal cannot be read back all keep their directory and make the new
      operation fail, so a half-written host is never built upon. The case
      drives the shipped functions over a scratch root and reads back sixteen
      facts: the journal is per transaction, names the transaction it belongs
      to and starts in `started`, is mode 0600, the verified end marks it
      installed, a later run cannot reopen it, an installed journal is retained
      with its install untouched, a pre-existing path comes back from the
      before-image, the reconciled directory is released and a second reconcile
      is a no-op, a journal with nothing written under it is released, a created
      path no record proves is preserved with the transaction retained and the
      incomplete outcome reported, an unreadable journal and a before-image that
      changed after it was taken both refuse rather than release, the firewall
      before-image is consulted, and the rollback entrypoint skips its own
      transaction. What the container proves is the functions' verdict and the
      bytes they leave on disk; the live run remains the source of truth for the
      host a real Worker carries.
  - requirement: Live scenario parity
    cases: [HOOK-04]
    reason: >-
      HOOK-04 is the other half of a rollback: compensation restores the paths
      the transaction wrote and never the packages it installed, so a host
      restored through PRESERVE carries package residue that the report has to
      name. What the package manager changed is therefore recorded while the
      transaction still knows it: `record_worker_package_baseline` captures a
      sorted `package<TAB>version` inventory into the transaction's own
      recovery directory after the journal exists and before
      `setup_system_prereqs` can install anything, and
      `record_worker_package_changes` diffs it against the host once every
      package-mutating step is behind the run — and again in the compensation,
      before the paths are put back. Both files are written through a temporary
      sibling with a fsync and a rename, at mode 0600; a package manager that
      cannot answer writes `#unavailable` instead of an empty inventory, and a
      baseline outside a journal directory or a delta without a baseline is
      refused rather than invented. The report is the shipped teardown:
      `read_package_changes` parses that record and refuses a missing header, an
      unknown kind, a short or long row, a field that is not a package name or
      version, and `#unavailable` mixed with rows; `execute_teardown` under
      PRESERVE returns the packages as `residual_state`, `restored_baseline`
      and `clean_baseline_eligible` false, and a message naming the remedy,
      while a teardown handed no record at all reports `inventory: unrecorded`
      rather than "no changes". The case drives the shipped functions over a
      scratch root with a stub package manager and hands the bytes the shell
      wrote to the shipped reader and the shipped teardown, so it decides
      sixteen facts: the baseline and the delta exist at mode 0600, the delta
      states the installed, upgraded and removed package with the versions on
      both sides, `#unavailable` is stated, both refusals hold, the record goes
      with the transaction, PRESERVE reports the residue, denies a restored
      baseline, denies eligibility and says `unrecorded` without a record, and
      every malformed record is refused. What the container proves is the
      record's shape and the report's verdict; whether a given host's dpkg
      inventory is complete stays the live run's to say.
  - requirement: Live scenario parity
    cases: [HOOK-01]
    reason: >-
      HOOK-01 is the shape half of the same sentence: a manifest records that a
      transaction created a hook at the managed path, not that what now sits
      there is that hook. `verify_deploy_hook_preflight` from `modules/nginx.sh`
      is sourced in a temporary tree and asked about eight shapes at that path --
      a symlink whose target holds the recorded bytes, a symlink to a provider's
      own file, a directory, a FIFO, a file edited after its manifest, a file
      the manifest names under a different path, a manifest that cannot be
      parsed at all, and a hook directory that is itself a symlink -- and each
      one is refused, with the symlink still pointing where it did, the
      target's bytes unchanged, the directory still a directory and the FIFO
      still a FIFO afterwards. The unmanaged regular file is the clause read in
      full: it is refused with the sentence that names the unmanaged host
      resource, and its bytes, its 0640 mode and its owner are unchanged while
      the count of manifests under the recovery root is the same before and
      after. The positive control is the file the manifest names and whose
      digest it records, which is adopted, so the refusals are not a
      preflight that refuses everything. No host is touched and no install runs;
      the case reads the exit status and what the preflight left on disk.
  - requirement: Live scenario parity
    cases: [REV-01, REV-02, BOOT-02]
    reason: >-
      the three are the withdrawal sentence of the credential requirement,
      decided by the controller the operator runs on this machine: the temporary
      access a run installs is taken back when the run ends. `_cleanup_access`,
      `_revoke_all`, `_cleanup_summary_message`, `_write_operator_only_report`
      and `_refresh_report` are driven against a model of the SSH client that
      answers the four probes the cleanup makes and records every command it is
      sent, so REV-01 reads the whole pass rather than a claim: the client is
      built from the control-machine key and the pinned `known_hosts`, the
      remote revoke script is named and run, `authorized_keys` is searched for
      the run's marker and the expiry timer is probed, and the sentinel body of
      that key appears in no command and in no report, which is left at mode
      0600 inside a 0700 directory. REV-02 walks every way the cleanup can fail
      — the marker alone, the timer alone, both, a target whose revoke script is
      missing, and a verification whose connection dies — and each one is
      INCOMPLETE with the sentence that names what remains, the stuck host
      fails the run even though the clean one passes, and `_refresh_report` on
      an otherwise PASS run-state rewrites the overall result to INCOMPLETE and
      records the cleanup under `operator_access_cleanup` while a passing
      cleanup leaves the same state at PASS. BOOT-02 reads the same withdrawal
      on a finished pair, from the hosts' own files rather than from the record:
      both markers gone from `authorized_keys`, both expiry timer files gone, the
      provider's own entry still in place, and three contours that must not pass
      — a cleanup whose script did nothing is `INCOMPLETE` and names what
      survived, and an unreachable host is recorded as such without stopping the
      revocation of the host behind it. Its damages are the ways a pass can be
      claimed without the key being gone: a revocation that skips a host, reuses
      one connection for both, removes the provider's entry, leaves a timer file,
      reports its own residue as a pass, or stops at the first failure. The
      transport is a seam and the host is a model: no SSH server answers, and
      none of the three claims one does.
  - requirement: Live scenario parity
    cases: [NEG-01, NEG-04]
    reason: >-
      both serve the parity sentence for the live negative suite's own matrix —
      the table about fault, component and the boundary the run has to stop at,
      which the delta spec states no scenario about. The table is a conjunction,
      so what the two cases read is the suite's case list rather than a verdict:
      NEG-01 requires the live requirement's sentence to still print fifteen
      rows, one per scenario id, each row's component cell still naming the
      component the case's table names, the live runner still defining one
      `run_neg_NN_*` function per row, and every witness a case this suite
      builds for the contour that row names — read from the catalog's own driver
      registry, so a witness removed from the code fails here instead of quietly
      emptying a catalog entry. NEG-04 is the same audit over the first ten rows,
      whose sentence states its scope inline (`NEG-01 through NEG-10`) instead of
      printing the table. Their damages are a row unbolded, a row naming another
      component, a sentence that lost the ten-row scope, a runner missing one
      scenario, and a witness built on no contour. What neither can check is
      that a witness asserts the right boundary: the mapping from row to case is
      a judgement written out row by row with a sentence saying what each
      witness proves.
  - requirement: Live scenario parity
    cases: [AIO-AUTH-NEG, MN-DUP-ADD, RED-01, RED-02, APIC-01]
    reason: >-
      all five serve the same parity sentence for rows of the live matrix the
      delta spec writes no scenario about. AIO-AUTH-NEG is the
      forged-credential row: four tokens copied from the one the documented
      login issued each fail exactly one clause of the Panel's own gate — an
      expired token signed with the Panel's real secret, a token signed with a
      foreign key, an unsigned `alg: none` token, and a correctly signed token
      naming an administrator record that does not exist — and every one is
      answered 401 with the middleware's `Unauthorized` body while the issued
      token still reads the same route before and after, so neither the refusal
      nor the control can be a route that simply stopped answering.
      MN-DUP-ADD is the duplicate-registration row: the operator's own
      `node add`, run for a name that `state.json` already holds at another
      address, exits nonzero with the existing-name refusal — naming the address
      the record holds — before the Panel client is constructed, and the state
      file's bytes, the committed journal's bytes and the Panel inventory are
      what they were, which is what distinguishes a refusal from a second record
      that was created and then cleaned up. The same name at the address the
      record already holds is the same node answering again and is accepted on
      purpose, because the wizard's per-node retry re-enters exactly that call;
      the case pins the second address with a throwaway key first, since an
      unpinned address is refused by the host-key check instead, and takes the
      pin out again. The
      third row of that group, a corrupted database inside an otherwise valid
      archive, is a variant of `MN-BACKUP-BAD` and is traced through the backup
      scenario rather than as a case of its own. RED-01 and RED-02 are the two
      rows of the live redaction requirement, which the delta spec also states
      without a scenario: RED-01 reads the operator's own credentials file,
      registers both secret values with the run's filter and writes the raw dump
      through the writer every artifact goes through, then reads the tree back —
      the field names survive, both values are `[REDACTED]`, and the run's own
      audit finds no file that changes when redacted, so a sibling artifact
      still holding a secret fails this case instead of being published. RED-02
      asks the real failure collector for its bundle on a healthy host and reads
      every area file back: the host's own kernel, distribution and installed
      package version, the unit state, journalctl's output, a listener, the
      vhost test, ufw's verdict and iptables' chain policy, and the served
      certificate's subject and validity — with no private key material and
      every file at 0600. The report-side half of that clause — API object
      summaries, traffic results and per-case timings — is carried by
      `result.json`, which the runner writes after the last case, so the case
      names it as not claimed here rather than reading a file that does not
      exist yet. APIC-01 is the bounded-client row: the controller's own
      `E2EPanelClient` logs in and lists nodes against the Panel's public name
      with the run's bundle, which is what makes the bundle the thing that
      carried the login, while a context with no anchor at all and the same
      bundle pointed at `127.0.0.1` are both refused — the second being
      hostname verification rather than a store the image happened to have.
      `API_TIMEOUT` is set to a value neither the client nor the parser defaults
      to and read back from both, and a caller that omits every optional
      argument still inherits that bound and the default context, so
      "production callers keep their behaviour" is measured rather than
      assumed. The two shipped sources are then read for a bypass token, so an
      `allowInsecure` or a disabled hostname check added to either makes the
      other clauses describe a client nobody ships
  - requirement: Independent Multi-Node acceptance topology
    cases: [MN-ENV-CONTRACT]
    reason: >-
      the requirement states what the Worker registration leaves running and
      what a client is served, and no scenario states the environment contract:
      the operator's `node add` accepts all seven inputs through environment
      variables instead of positional arguments, registers the Worker with the
      Panel, and the Panel reports the correct endpoint and connected state. The
      case serves that parity sentence by driving `node add` with the seven
      environment variables and verifying the Panel's node, endpoint and host
      inventory.
  - requirement: Independent All-in-One acceptance topology
    cases: [VERIFIED-ARTIFACT-FETCH]
    reason: >-
      the requirement states what the All-in-One install leaves running and what
      a client is served, and no scenario states the pinned artifact chain:
      the installer fetches the GoWave Node installer and the Panel release
      assets from ordered hosts with a pinned SHA-256 digest; a host that
      cannot deliver falls through to the next, a digest mismatch is terminal
      and the next host is never tried, no host delivering leaves nothing
      behind, and the destination file is replaced only after its bytes are
      verified. This case serves that parity sentence by driving the
      fetch_verified_artifact helper with a local test server.
  - requirement: Independent All-in-One acceptance topology
    cases: [PINNED-INSTALLER-HOSTS]
    reason: >-
      the requirement states what the All-in-One install leaves running and what
      a client is served, and no scenario states the pinned installer URLs:
      the commit is tried on GitHub first and jsDelivr second; the order is
      fixed and the environment variable GOWAVE_NODE_INSTALLER_COMMIT selects
      the exact commit. This case serves that parity sentence by driving the
      pinned_node_installer_urls function.
  - requirement: Independent All-in-One acceptance topology
    cases: [PANEL-ASSET-VERIFICATION]
    reason: >-
      the requirement states what the All-in-One install leaves running and what
      a client is served, and no scenario states the panel asset verification:
      a release asset is checked against SHA256SUMS before the next URL is
      tried; a mismatched asset aborts without falling through, the binary is
      not left behind, and no release API fallback occurs. This case serves
      that parity sentence by driving the download_panel_release function with
      a mismatched checksum.
  - requirement: Trustworthy result and diagnostics
    cases: [FAIL-STEP]
    reason: >-
      the requirement states the secret redaction and unexpected skip
      diagnostics, and no scenario states the ERR trap contract: the ERR trap
      with CURRENT_STEP prints a located failure naming the step, the failing
      command and its status, prints it exactly once, and exits with the step's
      status, and a step that succeeds prints no report. This case serves that
      parity sentence by sourcing gowave-auto.sh and forcing a step failure. The
      handler's own double-compensation guard is proven by the unit suite
      (tests/test_failure_report.py), not by this case.

# What the published report has to cover, one declaration at a time. A plain
# path is met by any behaviour that quotes it; `every_value` makes every element
# of the manifest's list an obligation of its own, so a fifth Vision combination
# added to the matrix turns this audit red instead of quietly widening a report
# that still names four.
behaviour_obligations:
  - path: user_agent.accepted
  - path: user_agent.absent
  - path: user_agent.blank
  - path: representations.base64
  - path: representations.xray-json
  - path: topologies.multi-node.vision_combinations
    every_value: true

# Behaviours the change names one by one. `declares` quotes the manifest — the
# audit refuses a path it does not hold and a value it does not state — which is
# what keeps a behaviour from claiming a policy the matrix has moved away from.
behaviours:
  - behaviour: A subscription request carrying a User-Agent is served
    requirement: Real Panel subscription lifecycle
    declares:
      path: user_agent.accepted
      value: non-empty header
    cases: [SUB-SERVED]
    topologies: [aio, multi-node]
    tests:
      - tests.test_podman_subscriptions.TestPanelSubscriptionProbe.test_each_representation_is_fetched_with_its_client_user_agent
      - tests.test_podman_subscriptions.TestSubscriptionWiring.test_every_subscription_case_is_in_the_shared_catalog
    jobs: [All-in-One Podman Acceptance, Multi-Node Podman Acceptance]

  - behaviour: A subscription request without a User-Agent header is refused
    requirement: Real Panel subscription lifecycle
    declares:
      path: user_agent.absent
      value: 403
    cases: [SUB-UA-ABSENT]
    topologies: [aio]
    tests:
      - tests.test_podman_subscriptions.TestSubscriptionCases.test_absent_user_agent_case_is_refused_for_every_representation
      - tests.test_podman_subscriptions.TestPanelSubscriptionProbe.test_an_absent_user_agent_is_a_request_without_the_header
    jobs: [All-in-One Podman Acceptance]

  - behaviour: A subscription request with a blank User-Agent header is refused
    requirement: Real Panel subscription lifecycle
    declares:
      path: user_agent.blank
      value: 403
    cases: [SUB-UA-BLANK]
    topologies: [aio]
    tests:
      - tests.test_podman_subscriptions.TestSubscriptionCases.test_blank_user_agent_case_is_a_separate_result
      - tests.test_podman_subscriptions.TestPanelSubscriptionProbe.test_a_blank_user_agent_is_an_empty_header_not_a_missing_one
    jobs: [All-in-One Podman Acceptance]

  - behaviour: The public edge serves the subscription without advertising it
    requirement: Panel subscription representations
    cases: [SUB-EDGE, SUB-EDGE-BAD]
    topologies: [aio]
    tests:
      - tests.test_podman_subscriptions.TestSubscriptionEdgeCases.test_edge_case_names_what_the_client_and_the_crawlers_received
      - tests.test_podman_subscriptions.TestSubscriptionEdgeCases.test_forgery_case_names_both_refusals_and_the_access_log
      - tests.test_podman_subscriptions.TestPanelSubscriptionProbe.test_the_edge_contract_scope_asks_the_edge_for_every_published_family
    jobs: [All-in-One Podman Acceptance]

  - behaviour: The public edge hides its build and hands the Panel only the peer address
    requirement: Independent All-in-One acceptance topology
    cases: [NGX-HYGIENE, NGX-SCANNER]
    topologies: [aio]
    tests:
      - tests.test_podman_aio.TestHygieneCase.test_hygiene_case_names_the_server_the_page_the_peer_and_the_routes
      - tests.test_podman_aio.TestHygieneCase.test_hygiene_case_rejects_a_peer_the_panel_did_not_record
      - tests.test_podman_aio.TestHygieneCase.test_scanner_case_names_the_refused_set_and_the_control
      - tests.test_nginx_routing.TestNginxRouting.test_panel_vhost_hands_the_panel_only_the_peer_address
    jobs: [All-in-One Podman Acceptance]

  - behaviour: An incomplete install request is refused before the installed host is touched
    requirement: Independent All-in-One acceptance topology
    cases: [PRE-INPUTS, PRE-INPUTS-BAD]
    topologies: [aio]
    tests:
      - tests.test_podman_aio.TestPreflightInputCase.test_missing_case_names_the_refusal_the_inventory_and_the_panel
      - tests.test_podman_aio.TestPreflightInputCase.test_missing_case_rejects_a_host_it_rewrote
      - tests.test_podman_aio.TestPreflightInputCase.test_bad_case_quotes_the_value_it_rejected
      - tests.test_podman_aio.TestPreflightInputCase.test_the_probe_asks_without_a_terminal_and_reads_the_product_back
      - tests.test_preflight.TestPreflightInputs.test_a_missing_panel_input_names_the_component_and_the_field
    jobs: [All-in-One Podman Acceptance]

  - behaviour: The base64 representation is the share-link list the inventory describes
    requirement: Panel subscription representations
    declares:
      path: representations.base64
      value: /api/sub/{shortUuid}
    cases: [SUB-B64]
    topologies: [aio, multi-node]
    tests:
      - tests.test_podman_subscriptions.TestSubscriptionCases.test_share_link_case_imports_the_decoded_list
      - tests.test_podman_subscriptions.TestSubscriptionClientProbe.test_the_base64_list_decodes_and_a_json_body_does_not
    jobs: [All-in-One Podman Acceptance, Multi-Node Podman Acceptance]

  - behaviour: The Xray JSON representation is served as a bare object and as a list
    requirement: Panel subscription representations
    declares:
      path: representations.xray-json
      value: /api/sub/{shortUuid}/v2ray-json
    cases: [SUB-JSON-SHAPES]
    topologies: [aio]
    tests:
      - tests.test_podman_subscriptions.TestSubscriptionCases.test_json_shape_case_loads_the_served_list_and_the_bare_object
      - tests.test_podman_subscriptions.TestSubscriptionClientProbe.test_json_shapes_accepts_the_served_list_and_the_bare_object
    jobs: [All-in-One Podman Acceptance]

  - behaviour: Worker provisioning dials the Master's private run address
    requirement: Podman-only Master address selection for Worker provisioning
    cases: [PODNET-MASTER-ADDR]
    topologies: [multi-node]
    tests:
      - tests.test_podman_multi_node.TestMasterAddressCase.test_the_run_address_is_accepted_when_the_worker_uses_it
      - tests.test_podman_address.TestPodmanAddressOverride.test_address_must_be_assigned_on_this_host
      - tests.test_podman_multi_node.TestWorkerProvisioningCommand.test_the_command_is_the_operator_entrypoint_with_positional_roles
    jobs: [Multi-Node Podman Acceptance]

  - behaviour: Vision runs on neither node
    requirement: Independent Multi-Node acceptance topology
    declares:
      path: topologies.multi-node.vision_combinations
      value: neither
    cases: [MN-VISION, MN-DP-*]
    topologies: [multi-node]
    tests:
      - tests.test_podman_cluster.TestVisionCase.test_a_node_without_vision_is_proven_to_have_no_endpoint_under_its_name
      - tests.test_podman_multi_node.TestMultiNodeCounts.test_the_four_vision_combinations_are_named_and_counted
    jobs: [Multi-Node Podman Acceptance]

  - behaviour: Vision runs on the Master only
    requirement: Independent Multi-Node acceptance topology
    declares:
      path: topologies.multi-node.vision_combinations
      value: master-only
    cases: [MN-VISION, MN-DP-*]
    topologies: [multi-node]
    tests:
      - tests.test_podman_cluster.TestVisionCase.test_the_inbound_is_matched_by_its_transport_not_by_its_tag
      - tests.test_podman_multi_node.TestMultiNodeCounts.test_the_four_vision_combinations_are_named_and_counted
    jobs: [Multi-Node Podman Acceptance]

  - behaviour: Vision runs on the Worker only
    requirement: Independent Multi-Node acceptance topology
    declares:
      path: topologies.multi-node.vision_combinations
      value: worker-only
    cases: [MN-VISION, MN-DP-*]
    topologies: [multi-node]
    tests:
      - tests.test_podman_cluster.TestVisionCase.test_a_worker_that_keeps_a_vision_vhost_without_it_is_refused
      - tests.test_podman_multi_node.TestMultiNodeCounts.test_the_four_vision_combinations_are_named_and_counted
    jobs: [Multi-Node Podman Acceptance]

  - behaviour: Vision runs on both nodes
    requirement: Independent Multi-Node acceptance topology
    declares:
      path: topologies.multi-node.vision_combinations
      value: both
    cases: [MN-VISION, MN-DP-*]
    topologies: [multi-node]
    tests:
      - tests.test_podman_cluster.TestVisionCase.test_each_combination_checks_both_nodes_against_their_own_names
      - tests.test_podman_multi_node.TestMultiNodeCounts.test_the_four_vision_combinations_are_named_and_counted
    jobs: [Multi-Node Podman Acceptance]

  - behaviour: A Worker whose pinned host key does not match is refused
    requirement: Security and network isolation verification
    cases: [MN-SSHKEY]
    topologies: [multi-node]
    tests:
