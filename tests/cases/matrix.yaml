# Versioned protocol/client acceptance matrix for the Podman product E2E.
# The matrix is consumed by the Podman runner and validated by catalog.py.
# It is not a second source of truth: every field is derived from the shipped
# inbound templates, the Panel subscription contracts, and the client releases
# pinned by digest below. The live runner follows the release instead
# (tools/live_vps_config.env.example records `latest` for both clients), so a
# version here is a statement about this harness, not about the live one.
#
# `host_record` is the Host record `modules/api_client.py` posts for the
# inbound (`host_projection`): the address a client dials, the SNI it presents,
# the ALPN it offers, the transport path and the `securityLayer` the Panel
# stores. `address_role` / `sni_role` name the domain the value comes from,
# because REALITY dials the panel's public address while presenting the REALITY
# domain as SNI.
version: 1
schema: gowave-podman-matrix/v1

product:
  # The versions a deployment configures, which is what a case compares the
  # installed binaries against. Panel and Node follow the shipped channel, as the
  # live config's default does (`latest`); the Xray core is pinned, because the
  # client core below is the same build and a server core that drifted from it
  # is the mismatch Pinned Version Fidelity names.
  panel_version: "latest"
  node_version: "latest"
  xray_version: "26.11.9"
  xray_client_version: "26.11.9"
  mihomo_client_version: "1.19.34"
  reality_fingerprint: "firefox"
  node_api_port: 3002
  panel_api_port: 3000

inbounds:
  - id: REALITY
    tag: vless-reality
    protocol: vless
    transport: tcp
    security: reality
    template: assets/xray/vless-reality.json
    fingerprint: firefox
    optional: false
    listener: 443/tcp
    subscription_protocol: vless
    host_record:
      address_role: panel
      sni_role: reality
      port: 443
      path: null
      host: null
      alpn: "h2,http/1.1"
      security_layer: DEFAULT
  - id: XHTTP
    tag: vless-xhttp
    protocol: vless
    transport: xhttp
    security: tls
    template: assets/xray/vless-xhttp.json
    fingerprint: firefox
    optional: false
    listener: 443/tcp
    subscription_protocol: vless
    host_record:
      address_role: panel
      sni_role: panel
      port: 443
      path: /xhttp-down/
      host: null
      alpn: "h2,http/1.1"
      security_layer: TLS
  - id: WS
    tag: vless-ws
    protocol: vless
    transport: ws
    security: tls
    template: assets/xray/vless-ws.json
    fingerprint: firefox
    optional: false
    listener: 443/tcp
    subscription_protocol: vless
    host_record:
      address_role: panel
      sni_role: panel
      port: 443
      path: /ws
      host: null
      alpn: "http/1.1"
      security_layer: TLS
  - id: TROJAN-GRPC
    tag: trojan-grpc
    protocol: trojan
    transport: grpc
    security: tls
    template: assets/xray/trojan-grpc.json
    fingerprint: firefox
    optional: false
    listener: 443/tcp
    subscription_protocol: trojan
    host_record:
      address_role: panel
      sni_role: panel
      port: 443
      path: trojan-grpc
      host: null
      alpn: "h2"
      security_layer: TLS
  - id: VISION
    tag: vless-vision
    protocol: vless
    transport: tcp
    security: tls
    template: assets/xray/vless-vision.json
    fingerprint: firefox
    optional: true
    listener: 8443/tcp
    subscription_protocol: vless
    host_record:
      address_role: vision
      sni_role: vision
      port: 443
      path: null
      host: null
      alpn: "http/1.1"
      security_layer: TLS

clients:
  - id: xray
    binary: xray
    version_key: xray_client_version
    consumes: [base64, xray-json]
    trust: tlsSettings.certificates usage=verify
    artifact:
      url: https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip
      sha256: "b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82"
      archive: zip
      member: xray
    version_check:
      argument: version
      contains: "Xray 26.11.9"
  - id: mihomo
    binary: mihomo
    version_key: mihomo_client_version
    consumes: [mihomo, clash]
    trust: scoped CA bundle
    artifact:
      url: https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1.19.34.gz
      sha256: "223fab877e5795ce780ba39902e5f0b1113c1256ae244a7160f1165e017e9ccc"
      archive: gz
      member: ""
    version_check:
      argument: -v
      contains: "v1.19.34"

representations:
  base64: "/api/sub/{shortUuid}"
  xray-json: "/api/sub/{shortUuid}/v2ray-json"
  mihomo: "/api/sub/{shortUuid}/mihomo"
  clash: "/api/sub/{shortUuid}/clash"
  singbox: "/api/sub/{shortUuid}/singbox"

user_agent:
  accepted: "non-empty header"
  absent: 403
  blank: 403

topologies:
  aio:
    nodes: [local]
    vision_combinations: [disabled, enabled]
    positive_case_counts:
      disabled: 8
      enabled: 10
    case_id_pattern: "AIO-DP-{inbound}-{client}"
    runtime_budget_seconds: 2700
    gate: [pre-push, pr]
  multi-node:
    nodes: [master, worker]
    vision_combinations: [neither, master-only, worker-only, both]
    positive_case_counts:
      neither: 16
      master-only: 18
      worker-only: 18
      both: 20
    case_id_pattern: "MN-DP-{node}-{inbound}-{client}"
    runtime_budget_seconds: 4500
    gate: [pre-push, pr]
  # The Panel and the static decoy on one host, with no traffic plane: no local
  # node, no backend on 8443/8444 and no Vision inbound. It therefore owes no
  # data-plane tuple — no case id pattern, no Vision combination and no positive
  # count — and its own cases (host shape, API state, the squad a later node add
  # creates) are declared by the suite rather than by this matrix. It is gated at
  # `pr` only: the pull request runs it as its own required check, while the push
  # gate keeps spending its minutes on the two traffic-plane suites.
  #
  # Its budget matches the Multi-Node one because it runs the same two heavy
  # steps from that suite — a real install and a real `node add` — and the `pr`
  # wave bounds one full wave plus one recovery wave at 4500 + 4500 s.
  panel-only:
    nodes: []
    vision_combinations: []
    positive_case_counts: {}
    case_id_pattern: ""
    runtime_budget_seconds: 4500
    gate: [pr]

runtime_budget:
  pre_push_total_seconds: 7200
  pr_total_seconds: 9000
  nightly_total_seconds: 14400
  on_exhaustion: INCOMPLETE

ci_tiers:
  L0: lint, static analysis, contract tests
  L1: existing transport acceptance
  L2: full All-in-One product E2E
  L3: full Multi-Node product E2E
  L4: lifecycle, backup/restore, channel update/rollback
  L5: QEMU cold boot
  L6: separately authorized live VPS acceptance

# Privilege scopes are not interchangeable. Rootless Podman cannot bind 80/443
# or prove host INPUT firewall isolation, so it may only run static self-checks
# and never claims product acceptance.
privilege_scopes:
  rootful:
    claim: product acceptance
    prerequisites:
      - EUID 0 (sudo)
      - podman info Host.Security.Rootless=false
      - cgroup v2 with the systemd cgroup manager
      - netavark network backend
    required_for:
      - privileged systemd container boot
      - host firewall (UFW/nftables) INPUT isolation
      - listener binding on 80/443
      - Worker mTLS control plane and port 3002 isolation
      - Panel and NGINX service supervision
  rootless:
    claim: static self-checks only
    checks: [catalog-parity, image-lock, matrix-schema, harness-contracts]
    excluded:
      - every product topology case
      - every firewall, listener, and service assertion
