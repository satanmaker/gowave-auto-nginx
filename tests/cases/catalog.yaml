- id: AIO-PKT-02
  requirement: Per-Case Data-Plane Packet Evidence
  live_scenario: null
  assertion: Four degradations are produced against a real transfer through the installed host — a capture
    tool that is not there, a host that cannot report the client's address because nothing answers the
    identity port, a capture that ran out its own window before the harness stopped it, and an identity
    channel that did not travel the request's path — and every one of them is INCOMPLETE with the missing
    fact named, the non-matching source address recorded for the last, no aggregate counter read as an
    answer, and no capture file or saved payload left on the host.
