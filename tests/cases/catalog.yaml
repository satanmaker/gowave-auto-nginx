- id: NEG-01
  requirement: Negative Scenario and Fault Injection Tests
  live_scenario: Matrix of fifteen fault scenarios verified (NEG-01..NEG-15)
  assertion: '**GIVEN** a valid E2E config with isolated local preflight fixtures and a confirmed disposable
    VPS testbed for the live fault-injection cases

    **WHEN** the runner executes the negative test suite

    **THEN** all 15 scenarios terminate at their designated boundaries per the following matrix:


    | Scenario ID | Component / Area | Fault Injection Method | Expected Failure Boundary & Outcome |

    |-------------|------------------|------------------------|--------------------------------------|

    | **NEG-01**  | Preflight SSH    | Host key absent or mutated in `known_hosts` | Terminate before
    any remote modification |

    | **NEG-02**  | Preflight SSH    | Target SSH port closed / unreachable | Terminate with connectivity
    timeout before execution |

    | **NEG-03**  | Preflight DNS    | Domain resolves to wrong IP address | Terminate before remote modification
    |

    | **NEG-04**  | Preflight DNS    | Missing AAAA record when `ENABLE_IPV6=true` | Preflight failure
    before execution |

    | **NEG-05**  | ACME Install     | Certbot challenge failure (NXDOMAIN / blocked 80) | Installation
    aborts; services not marked healthy |

    | **NEG-06**  | NGINX Config     | Syntax corruption in `/etc/nginx/conf.d/*.conf` | `nginx -t` fails;
    runner blocks activation |

    | **NEG-07**  | Worker Node      | `systemctl stop gowave-node` on Worker | Panel detects offline;
    `isConnected` becomes `false` |

    | **NEG-08**  | Worker Node      | `systemctl start gowave-node` on Worker | Panel recovers; `isConnected`
    returns `true` |

    | **NEG-09**  | Subscription     | Request without User-Agent header | Real Panel rejects with upstream
    policy code (e.g. 403) |

    | **NEG-10**  | mTLS Control     | Forged / self-signed client certificate | Worker TLS 1.3 rejects
    handshake before HTTP handler |

    | **NEG-11**  | Backup Restore   | Corrupted archive header / invalid tar format | Preflight check
    rejects before mutating live files |

    | **NEG-12**  | Backup Restore   | SQLite DB file in archive corrupted | SQLite integrity check fails
    before replacing live DB |

    | **NEG-13**  | Worker Deploy    | SSH pipeline interrupted mid-execution | Master recovery journal
    does NOT enter `COMMITTED` |

    | **NEG-14**  | Worker Deploy    | Duplicate `node add` when the worker name is already in `state.json`
    | Explicit fail-fast rejection before API mutation; no duplicate DB entities or hosts |

    | **NEG-15**  | Panel API Auth   | API request with expired or forged JWT | Panel returns 401 Unauthorized
    |'
  assertion_sha256: d31528a0886a73f7929325ad2140462f3c3f0a1214b84c6c9e53a15b1aa41a0c
  runs_in:
  - podman
  - live
  state: live-parity
  environment: container
  topology:
  - aio
  - multi-node
  gate: pre-push
  driver: null
  driver_status: planned
  promotion_target: null
