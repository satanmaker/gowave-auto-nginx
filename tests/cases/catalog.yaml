- id: MN-MATRIX
  requirement: Real client data-plane verification
  live_scenario: null
  assertion: The executed positive data-plane cases are exactly the matrix tuples of both nodes — each
    node contributing one case per inbound it was configured with times every client, so 16 without the
    optional inbound, 18 with Vision on one node and 20 with it on both — and a count that disagrees with
    the matrix, a node that never ran one of the clients, a declared case the matrix does not enumerate,
    or a tuple that produced no result fails the run instead of being counted as green.
  assertion_sha256: 257bcd082973db20a36ab866aec5ba61d2fa43bbcad869446ec439203e2b11b6
