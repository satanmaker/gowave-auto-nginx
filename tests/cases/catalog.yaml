- id: FW-01
  requirement: UFW Firewall Isolation Verification
  live_scenario: Worker allows Master and blocks Control Machine
  assertion: '**GIVEN** Worker Node is active and a positive mTLS probe from Master succeeds

    **WHEN** the runner records the source address seen by Worker for that successful connection and then
    probes Worker:3002 from Control Machine

    **THEN** the observed Master source address matches the effective UFW allow rule; the Control Machine
    probe is blocked; and Worker-side UFW rule/counter or packet trace confirms the DROP path. The Worker
    MUST also observe the actual source address of the Control Machine probe and prove it differs from
    the allowed Master source. If the two source addresses are equal, this negative probe is `INCOMPLETE`,
