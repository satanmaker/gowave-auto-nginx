- id: AIO-02
  requirement: All-in-One Master VPS Installation Verification
  live_scenario: Installer TLS/SNI probe trusts only the per-run CA bundle
  assertion: '**GIVEN** `ACME_MODE=staging` and the runner has validated the D9 mode-specific CA bundle

    **WHEN** `gowave-auto.sh install` runs `verify_public_tls_sni` on Master

    **THEN** the runner stages that bundle in a root-only `/run` file and supplies `GOWAVE_TLS_CA_FILE`;
    the probe uses `-CAfile`, `-verify_return_error`, and `-verify_hostname`, so the staging certificate
    succeeds without adding Staging roots to `/etc/ssl/certs`; an untrusted test CA fails; the temporary
    bundle is removed on success or failure'
