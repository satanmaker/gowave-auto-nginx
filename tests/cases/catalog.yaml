    host bound to it under its own name, holds a certificate covering that name that renews from this
    run''s ACME directory, routes the name to its Vision inbound and runs that inbound in its applied
    config; an unconfigured node has none of those under its own name, so swapping the two nodes'' Vision
    configuration fails. The configuration the run was given is also written as a document and read back
    through the live runner''s whitelist parser: each of the two optional fields survives unchanged, and
