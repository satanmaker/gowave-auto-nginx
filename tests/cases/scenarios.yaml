# How each live acceptance scenario is answered, as a checked field rather than a
# default. `build_catalog` reads this file, so a scenario the spec gains and this
# file does not classify fails generation instead of being claimed by a container
# that never ran it; `validate_catalog` holds the same rule in both directions.
schema: gowave-live-scenario-environments/v1
